name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement', 'feat']
  - title: '🐛 Bug Fixes'
    labels: ['fix', 'bug']
  - title: '🔒 Security'
    labels: ['security']
  - title: '🧹 Maintenance'
    labels: ['chore', 'ci', 'build', 'refactor', 'test', 'docs', 'dependencies']

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'  # avoid markdown / mention injection from PR titles

version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['minor', 'feature', 'enhancement', 'feat']
  patch:
    labels: ['patch', 'fix', 'bug', 'security', 'chore', 'ci', 'build', 'refactor', 'test', 'docs', 'dependencies']
  default: patch

exclude-labels:
  - 'skip-changelog'

# Auto-label PRs from their conventional-commit title so the changelog is categorised
# even when no label is set manually.
autolabeler:
  - label: 'breaking'
    title: ['/!:/']
  - label: 'feat'
    title: ['/^feat(\(.+\))?!?:/i']
  - label: 'fix'
    title: ['/^fix(\(.+\))?!?:/i']
  - label: 'security'
    title: ['/^sec(urity)?(\(.+\))?!?:/i']
  - label: 'docs'
    title: ['/^docs(\(.+\))?!?:/i']
  - label: 'ci'
    title: ['/^ci(\(.+\))?!?:/i']
  - label: 'build'
    title: ['/^build(\(.+\))?!?:/i']
  - label: 'refactor'
    title: ['/^refactor(\(.+\))?!?:/i']
  - label: 'test'
    title: ['/^test(\(.+\))?!?:/i']
  - label: 'chore'
    title: ['/^chore(\(.+\))?!?:/i']

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
