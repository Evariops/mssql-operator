name: Refresh SQL image catalog

# Keeps SqlServerPublishedTags.g.cs — the snapshot of what mcr.microsoft.com/mssql/server
# actually publishes — current, WITHOUT putting the registry in the operator's runtime path.
# The admission and reconcile guards read the committed snapshot (hermetic, works air-gapped);
# this job is the only thing that touches the live registry, and it only opens a PR. A human
# reviews it: the snapshot is facts, moving the default CU is a separate policy decision that
# PinnedImage_IsNotStale flags on the resulting PR.
on:
  schedule:
    # Weekly, Monday 06:00 UTC — before the Renovate window, and cadence enough for a registry
    # that ships a CU every few weeks.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege by default.
permissions:
  contents: read

concurrency:
  group: refresh-sql-images
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh registry snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the snapshot branch
      pull-requests: write # open/refresh the PR
      issues: write # report a failed scheduled run
    env:
      SNAPSHOT: src/MsSqlOperator/Configuration/SqlServerPublishedTags.g.cs
      BRANCH: automated/refresh-sql-image-catalog
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # NuGetAudit off: this job only reads the registry's tag list. An advisory published against a
      # dependency is for CI to report (build-and-test fails on it), not a reason to stop refreshing
      # the catalogue — the runs of 2026-10-19 and 2026-10-26 were lost to one.
      # The output path is explicit: `dotnet run` starts in the project directory (Web SDK), where the
      # repository-relative default used to resolve to src/MsSqlOperator/src/MsSqlOperator/….
      - name: Regenerate snapshot from the registry
        run: dotnet run --project src/MsSqlOperator/MsSqlOperator.csproj --property:NuGetAudit=false -- refresh-images "$GITHUB_WORKSPACE/$SNAPSHOT"

      # The snapshot records the day it was taken, so the file differs on every run; only a change in
      # the tag list is worth a PR.
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -I 'public const string SnapshotDate' -- "$SNAPSHOT"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot unchanged — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A generated file that does not compile is a generator bug, not a PR — fail loud instead.
      - name: Validate the refreshed snapshot compiles
        if: steps.diff.outputs.changed == 'true'
        run: dotnet build src/MsSqlOperator/MsSqlOperator.csproj -c Release --property:NuGetAudit=false

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$SNAPSHOT"
          git commit -m "chore: refresh SQL Server image catalog snapshot"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"

          body=$'Regenerated `SqlServerPublishedTags.g.cs` from the live registry tag list.\n\nThis PR is **facts** (what the registry publishes). Moving the default CU is a separate **policy** decision — check `PinnedImage_IsNotStale`: if it fails, a newer CU shipped and the pinned default in `SqlServerImages.cs` should probably follow.\n\nNote: opened by the built-in token, so CI may not auto-run. Close/reopen (or push an empty commit) to trigger it.'
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore: refresh SQL Server image catalog snapshot" \
              --body "$body"
          else
            echo "PR already open for $BRANCH — force-pushed the update."
          fi

      # A failed scheduled run is otherwise only visible in the Actions tab: this job failed every
      # week from 2026-08-17 to 2026-10-26 without anyone noticing. One open issue, commented on
      # each further failure.
      - name: Report the failure
        if: failure() && github.event_name == 'schedule'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Refresh SQL image catalog is failing"
          issue=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPO" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "$title" --body "The weekly refresh of \`SqlServerPublishedTags.g.cs\` failed: $RUN_URL

          While it fails, admission does not know the CUs published since the snapshot date (they pass with a warning), and \`PinnedImage_IsNotStale\` cannot flag a default left behind."
          fi
