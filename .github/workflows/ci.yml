name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 'labeled' lets a maintainer publish a debug image from a PR head by applying the
    # 'build-image' label (see the docker job's condition) — without merging to main.
    types: [opened, synchronize, reopened, labeled]
  # Versioned image publishing on tags is handled by release.yml (on release: published),
  # so this workflow no longer triggers on tags to avoid double-building the image.

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  zizmor:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor==1.5.2 --persona=pedantic --no-online-audits .github/workflows/

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MsSqlOperator.sln

      - name: Build
        run: dotnet build MsSqlOperator.sln --no-restore -c Release

      - name: Format check
        run: dotnet format MsSqlOperator.sln --verify-no-changes

      - name: Unit Tests
        # xUnit v4 drops VSTest: the test project is a standalone executable, run directly,
        # and its runner writes the TRX itself (-result-trx).
        run: ./tests/MsSqlOperator.Tests/bin/Release/net10.0/MsSqlOperator.Tests -result-trx test-results.trx

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: |
            **/test-results.trx

  integration-tests:
    name: Integration Tests (real SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MsSqlOperator.sln

      # These tests run the SQL managers against a real SQL Server via Testcontainers.
      # They cover CREATE LOGIN / MASTER KEY / CERTIFICATE and stored-procedure deployment —
      # exactly the DDL paths that unit tests (which mock SQL) cannot validate. The runner
      # is amd64 with Docker available, so the mssql 2022 image starts natively.
      - name: Integration Tests
        run: dotnet run --project tests/MsSqlOperator.IntegrationTests/MsSqlOperator.IntegrationTests.csproj -c Release -- -result-trx integration-results.trx

      - name: Upload integration test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-test-results
          path: '**/integration-results.trx'

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: helm lint
        run: helm lint charts/mssql-operator

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum --check
          tar xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/

      - name: helm template + kubeconform (values matrix)
        run: |
          set -euo pipefail
          for combo in \
            "" \
            "--set webhook.enabled=false --set viewApi.enabled=false" \
            "--set breakout.enabled=false" \
            "--set webhook.certManager.enabled=true" \
            "--set networkPolicy.enabled=true"; do
            echo "=== values: $combo ==="
            # CRDs use future apiextensions features; skip them in kubeconform, lint covers them.
            helm template t charts/mssql-operator $combo \
              | kubeconform -strict -ignore-missing-schemas -skip CustomResourceDefinition,APIService,CiliumNetworkPolicy
          done

  docker-pr:
    name: Docker build (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build the image on PRs (amd64 only, no push) so a broken Dockerfile fails CI.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile
          platforms: linux/amd64
          push: false

  e2e:
    name: E2E Smoke (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind (pinned)
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind" | sha256sum --check
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: Create cluster
        run: kind create cluster --name e2e --wait 120s

      - name: Build operator image
        run: docker build -t mssqloperator:e2e -f src/Dockerfile .

      - name: Load image into kind
        run: kind load docker-image mssqloperator:e2e --name e2e

      - name: Run smoke test
        run: bash tests/e2e/run-e2e.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          echo '--- operator pods ---'
          kubectl -n mssql-operator get pods -o wide
          echo '--- operator logs ---'
          kubectl -n mssql-operator logs deploy/mssql-operator --tail=300
          echo '--- e2e namespace ---'
          kubectl -n mssql-e2e get all,sqlinstances,events
          echo '--- sql pod describe ---'
          kubectl -n mssql-e2e describe pod sql-e2e-0
          echo '--- apiservices ---'
          kubectl get apiservice v1alpha1.view.mssql-operator.evariops.com -o yaml

  docker:
    name: Docker Image
    # The main image must not ship while integration tests are red.
    needs: [build-and-test, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Publish on push to main, OR from a PR head when a maintainer applies the 'build-image'
    # label (debug/QA images for a real cluster). Label-gating is the supply-chain control:
    # only a maintainer can apply it, and fork PRs never receive the registry token.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'build-image'))
    permissions:
      contents: read
      packages: write # push the operator image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default 'docker' driver cannot produce provenance/SBOM attestations; set up a
      # docker-container builder so the provenance/sbom outputs below are supported.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
