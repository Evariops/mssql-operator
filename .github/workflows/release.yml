name: Release

# Fires when a draft release is validated (published) — release-drafter creates the tag and
# publishes the GitHub Release, which triggers this workflow to build and push the versioned image.
on:
  release:
    types: [published]

permissions:
  contents: read

# Serialise publishes per release; never cancel an in-flight image push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing ships unless the tagged commit passes the full test suite.
  verify:
    name: Verify (unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet run --project tests/MsSqlOperator.Tests/MsSqlOperator.Tests.csproj -c Release

      - name: Integration tests
        run: dotnet run --project tests/MsSqlOperator.IntegrationTests/MsSqlOperator.IntegrationTests.csproj -c Release

  publish-image:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    # Limited to the release tags v*: no other ref can push or sign a release image.
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the operator image to ghcr.io
      id-token: write # Cosign keyless (OIDC) + build provenance attestation
      attestations: write # attest-build-provenance stores the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default 'docker' driver cannot produce provenance/SBOM attestations.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI references must be lowercase, but github.repository preserves the repo's casing
      # (e.g. Evariops/mssql-operator). cosign/attest reject the mixed-case ref otherwise.
      - name: Resolve lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keyless signature + provenance attestation on the pushed digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # GitHub's attestation API (attest-build-provenance) is unavailable on free-tier
      # user-owned private repositories. The image is already cosign-signed (above) and carries
      # buildx provenance + SBOM (provenance/sbom: true), so skip this step while the repo is
      # private; it runs automatically once the repo is public.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record digest in the release notes
        run: |
          echo "Image digest: \`${REGISTRY}/${IMAGE_NAME}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: cosign verify ${REGISTRY}/${IMAGE_NAME}@${DIGEST} --certificate-identity '${IDENTITY}' --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> "$GITHUB_STEP_SUMMARY"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          # The exact signing identity — this workflow, at this tag. A '.*' regexp accepted a
          # signature made by any GitHub workflow of any repository.
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}

  # Package and push the chart with the release version so installs no longer
  # default to the stale appVersion baked into Chart.yaml (0.0.1).
  publish-chart:
    name: Publish Helm chart
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the chart OCI artifact to ghcr.io
      id-token: write # Cosign keyless signature of the chart artifact
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package chart with release version
        run: |
          VERSION="${TAG_NAME#v}"
          helm package charts/mssql-operator --version "$VERSION" --app-version "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log in to registry (helm)
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Push chart
        id: push
        run: |
          set -euo pipefail
          helm push "mssql-operator-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" 2>&1 | tee push.log
          echo "digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)" >> "$GITHUB_OUTPUT"

      # The chart is signed like the image (keyless), so a consumer can verify both.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart (keyless)
        run: |
          set -euo pipefail
          cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/mssql-operator@${DIGEST}"
          echo "Chart: oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/mssql-operator@${DIGEST} — verify with cosign verify --certificate-identity '${IDENTITY}' --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
