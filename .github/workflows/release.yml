name: Release

# Fires when a draft release is validated (published) — release-drafter creates the tag and
# publishes the GitHub Release, which triggers this workflow to build and push the versioned image.
on:
  release:
    types: [published]

permissions:
  contents: read

# Serialise publishes per release; never cancel an in-flight image push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing ships unless the tagged commit passes the full test suite.
  verify:
    name: Verify (unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet run --project tests/MsSqlOperator.Tests/MsSqlOperator.Tests.csproj -c Release

      - name: Integration tests
        run: dotnet run --project tests/MsSqlOperator.IntegrationTests/MsSqlOperator.IntegrationTests.csproj -c Release

  publish-image:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the operator image to ghcr.io
      id-token: write # Cosign keyless (OIDC) + build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default 'docker' driver cannot produce provenance/SBOM attestations.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI references must be lowercase, but github.repository preserves the repo's casing
      # (e.g. Evariops/mssql-operator). cosign/attest reject the mixed-case ref otherwise.
      - name: Resolve lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keyless signature + provenance attestation on the pushed digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # GitHub's attestation API (attest-build-provenance) is unavailable on free-tier
      # user-owned private repositories. The image is already cosign-signed (above) and carries
      # buildx provenance + SBOM (provenance/sbom: true), so skip this step while the repo is
      # private; it runs automatically once the repo is public.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record digest in the release notes
        run: |
          echo "Image digest: \`${REGISTRY}/${IMAGE_NAME}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: cosign verify ${REGISTRY}/${IMAGE_NAME}@${DIGEST} --certificate-identity-regexp '.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> "$GITHUB_STEP_SUMMARY"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

  # Package and push the chart with the release version so installs no longer
  # default to the stale appVersion baked into Chart.yaml (0.0.1).
  publish-chart:
    name: Publish Helm chart
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the chart OCI artifact to ghcr.io
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package chart with release version
        run: |
          VERSION="${TAG_NAME#v}"
          helm package charts/mssql-operator --version "$VERSION" --app-version "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log in to registry (helm)
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Push chart
        run: helm push "mssql-operator-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
