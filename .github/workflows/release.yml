name: Release

# Fires when a draft release is validated (published) — release-drafter creates the tag and
# publishes the GitHub Release, which triggers this workflow to build and push the versioned image.
on:
  release:
    types: [published]

permissions:
  contents: read

# Serialise publishes per release; never cancel an in-flight image push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing ships unless the tagged commit passes the full test suite.
  verify:
    name: Verify (unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test src/MsSqlOperator.Tests/MsSqlOperator.Tests.csproj -c Release

      - name: Integration tests
        run: dotnet test src/MsSqlOperator.IntegrationTests/MsSqlOperator.IntegrationTests.csproj -c Release

  publish-image:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the operator image to ghcr.io
      id-token: write # Cosign keyless (OIDC) + build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The default 'docker' driver cannot produce provenance/SBOM attestations.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI references must be lowercase, but github.repository preserves the repo's casing
      # (e.g. Evariops/mssql-operator). cosign/attest reject the mixed-case ref otherwise.
      - name: Resolve lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: src
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keyless signature + provenance attestation on the pushed digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign image (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # GitHub's attestation API (attest-build-provenance) is unavailable on free-tier
      # user-owned private repositories. The image is already cosign-signed (above) and carries
      # buildx provenance + SBOM (provenance/sbom: true), so skip this step while the repo is
      # private; it runs automatically once the repo is public.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record digest in the release notes
        run: |
          echo "Image digest: \`${REGISTRY}/${IMAGE_NAME}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: cosign verify ${REGISTRY}/${IMAGE_NAME}@${DIGEST} --certificate-identity-regexp '.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> "$GITHUB_STEP_SUMMARY"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

  # Package and push the chart with the release version so installs no longer
  # default to the stale appVersion baked into Chart.yaml (0.0.1).
  publish-chart:
    name: Publish Helm chart
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the chart OCI artifact to ghcr.io
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Package chart with release version
        run: |
          VERSION="${TAG_NAME#v}"
          helm package charts/mssql-operator --version "$VERSION" --app-version "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log in to registry (helm)
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Push chart
        run: helm push "mssql-operator-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
