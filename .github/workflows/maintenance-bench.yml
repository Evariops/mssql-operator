name: Maintenance bench

# Node drains on a kind cluster of three workers, on every pull request that touches
# node maintenance or failovers, every night on main, and on demand. 20 to 30 minutes.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/MsSqlOperator.Core/Maintenance/**"
      - "src/MsSqlOperator/Services/Maintenance/**"
      - "src/MsSqlOperator/Services/SqlServer/AgFailoverOrchestrator.cs"
      - "src/MsSqlOperator/Controllers/SqlAvailabilityGroupController.cs"
      - "src/MsSqlOperator/Operator/Webhooks/EvictionWebhook.cs"
      - "src/MsSqlOperator/Services/Kubernetes/StatefulSetBuilder.cs"
      - "charts/mssql-operator/templates/webhook.yaml"
      - "tests/e2e/maintenance/**"
      - ".github/workflows/maintenance-bench.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: Node maintenance (kind, 3 workers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind (pinned)
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind" | sha256sum --check
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: Create cluster
        run: kind create cluster --name bench --config tests/e2e/maintenance/kind.yaml --wait 180s

      - name: Build operator image
        run: docker build -t mssqloperator:e2e -f src/Dockerfile .

      # The SQL Server image is pulled by the nodes: `kind load` fails to import its multi-platform
      # index (`ctr import --all-platforms`).
      - name: Load the operator image into kind
        run: kind load docker-image mssqloperator:e2e --name bench

      - name: Run the bench
        run: bash tests/e2e/maintenance/run.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          kubectl get nodes -o wide
          kubectl -n mssql-operator get pods -o wide
          kubectl -n mssql-operator logs deploy/mssql-operator --tail=400
          kubectl -n mssql-bench get sqlavailabilitygroup bench -o yaml
          kubectl -n mssql-bench get pods,pvc -o wide
          kubectl -n mssql-bench get events.events.k8s.io --sort-by=.metadata.creationTimestamp
          kubectl -n mssql-bench logs writer --tail=50
