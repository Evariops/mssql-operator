apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sqlavailabilitygroupdatabases.mssql.operator
spec:
  group: mssql.operator
  names:
    kind: SqlAvailabilityGroupDatabase
    listKind: SqlAvailabilityGroupDatabaseList
    plural: sqlavailabilitygroupdatabases
    singular: sqlavailabilitygroupdatabase
    shortNames:
    - sagdb
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              availabilityGroupRef:
                properties:
                  name:
                    type: string
                type: object
              databaseName:
                type: string
              seedingMode:
                type: string
                enum:
                - Automatic
                - Manual
                default: Automatic
              dataMovement:
                nullable: true
                properties:
                  suspended:
                    type: boolean
                  requireManualResumeAfterDataLoss:
                    type: boolean
                type: object
            required:
            - availabilityGroupRef
            - databaseName
            type: object
          status:
            properties:
              phase:
                type: string
              observedGeneration:
                format: int64
                type: integer
              availabilityGroupName:
                nullable: true
                type: string
              databaseName:
                nullable: true
                type: string
              replicaStates:
                items:
                  properties:
                    replica:
                      type: string
                    role:
                      type: string
                    synchronizationState:
                      type: string
                    isFailoverReady:
                      type: boolean
                    logSendQueueSize:
                      format: int64
                      type: integer
                    redoQueueSize:
                      format: int64
                      type: integer
                  type: object
                nullable: true
                type: array
              conditions:
                items:
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    lastTransitionTime:
                      format: date-time
                      nullable: true
                      type: string
                  type: object
                nullable: true
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - jsonPath: .spec.databaseName
      name: Database
      type: string
    - jsonPath: .spec.availabilityGroupRef.name
      name: AG
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
