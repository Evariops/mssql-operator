apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validators
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: 
    service:
      name: operator
      path: /validate/sqlagentjob
  matchPolicy: Exact
  name: validate.sqlagentjob.mssql.operator.v1alpha1
  rules:
  - apiGroups:
    - mssql.operator
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - sqlagentjobs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: 
    service:
      name: operator
      path: /validate/sqlavailabilitygroupdatabase
