apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql-failover-breakout
  namespace: mssql-operator
  labels:
    app: mssql-failover-breakout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mssql-failover-breakout
  template:
    metadata:
      labels:
        app: mssql-failover-breakout
    spec:
      serviceAccountName: mssql-failover-breakout
      containers:
        - name: breakout-controller
          image: ghcr.io/mssqloperator/mssql-operator:latest
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 128Mi
          env:
            - name: FailoverBreakout__Enabled
              value: "true"
            - name: FailoverBreakout__ControlLoopPeriodSeconds
              value: "5"
            - name: FailoverBreakout__TerminatingThresholdSeconds
              value: "30"
            - name: FailoverBreakout__NodeReadyGracePeriodSeconds
              value: "60"
            - name: FailoverBreakout__FencingDriver
              value: "volumeattachment"
            - name: FailoverBreakout__MaxConcurrentFencing
              value: "3"
            - name: FailoverBreakout__BlacklistConfigMapNamespace
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
