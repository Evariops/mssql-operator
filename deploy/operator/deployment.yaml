apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql-operator
  namespace: mssql-operator-system
  labels:
    app.kubernetes.io/name: mssql-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mssql-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mssql-operator
    spec:
      serviceAccountName: mssql-operator
      containers:
        - name: operator
          image: mssql-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
