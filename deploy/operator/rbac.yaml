apiVersion: v1
kind: Namespace
metadata:
  name: mssql-operator-system
  labels:
    app.kubernetes.io/name: mssql-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mssql-operator
  namespace: mssql-operator-system
  labels:
    app.kubernetes.io/name: mssql-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mssql-operator
  labels:
    app.kubernetes.io/name: mssql-operator
rules:
  - apiGroups: ["mssql.operator"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets", "services", "pods", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mssql-operator
  labels:
    app.kubernetes.io/name: mssql-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mssql-operator
subjects:
  - kind: ServiceAccount
    name: mssql-operator
    namespace: mssql-operator-system
