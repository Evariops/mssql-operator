apiVersion: v1
kind: Namespace
metadata:
  name: mssql-ag-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: mssql-sa-password
  namespace: mssql-ag-demo
type: Opaque
stringData:
  password: "YourStr0ngP@ssw0rd!"
---
apiVersion: mssql.operator/v1alpha1
kind: SqlAvailabilityGroup
metadata:
  name: my-ag
  namespace: mssql-ag-demo
spec:
  replicas:
    count: 3
    synchronousCount: 2
  saPasswordSecretRef:
    name: mssql-sa-password
    key: password
  instanceTemplate:
    version: "2022"
    edition: Enterprise
    acceptEula: true
    storage:
      data:
        size: 20Gi
        storageClassName: fast-ssd
      log:
        size: 10Gi
        storageClassName: fast-ssd
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        cpu: "4"
        memory: "16Gi"
  listener:
    port: 1433
    service:
      type: LoadBalancer
  readOnlyListener:
    port: 1434
    service:
      type: ClusterIP
  antiAffinity:
    type: Required
    topologyKey: kubernetes.io/hostname
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      delayBetweenInstances: 120
