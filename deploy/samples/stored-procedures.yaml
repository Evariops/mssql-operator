apiVersion: mssql.operator/v1alpha1
kind: SqlStoredProcedure
metadata:
  name: inline-procs
  namespace: mssql-demo
spec:
  instanceRef:
    name: my-sql-instance
  databases: [MyAppDB]
  inline:
    - name: usp_GetCustomers
      schema: dbo
      definition: |
        CREATE OR ALTER PROCEDURE [dbo].[usp_GetCustomers]
            @ActiveOnly BIT = 1
        AS
        BEGIN
            SET NOCOUNT ON;
            SELECT Id, Name, Email, CreatedAt
            FROM dbo.Customers
            WHERE @ActiveOnly = 0 OR IsActive = 1
            ORDER BY Name;
        END
    - name: usp_UpdateCustomerEmail
      schema: dbo
      definition: |
        CREATE OR ALTER PROCEDURE [dbo].[usp_UpdateCustomerEmail]
            @CustomerId INT,
            @NewEmail NVARCHAR(256)
        AS
        BEGIN
            SET NOCOUNT ON;
            UPDATE dbo.Customers
            SET Email = @NewEmail, ModifiedAt = GETUTCDATE()
            WHERE Id = @CustomerId;
        END
  deploymentOptions:
    strategy: CreateOrAlter
    validateSyntax: true
    transactional: true
---
apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: mssql-demo
type: Opaque
stringData:
  token: "ghp_your_token_here"
---
apiVersion: mssql.operator/v1alpha1
kind: SqlStoredProcedure
metadata:
  name: github-procs
  namespace: mssql-demo
spec:
  instanceRef:
    name: my-sql-instance
  databases: [MyAppDB]
  github:
    repository: my-org/sql-procedures
    path: procedures/
    filePattern: "*.sql"
    ref:
      tag: v1.2.0
    authSecretRef:
      name: github-token
      key: token
  sync:
    followLatestRelease: true
    releaseFilter: "v*"
  deploymentOptions:
    strategy: CreateOrAlter
    validateSyntax: true
    transactional: true
    executionOrder: Alphabetical
