# Minimal Express instance for the CI smoke test.
apiVersion: v1
kind: Namespace
metadata:
  name: mssql-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: mssql-sa-password
  namespace: mssql-e2e
type: Opaque
stringData:
  password: "E2e-Str0ngP@ssw0rd!"
---
apiVersion: mssql-operator.evariops.com/v1alpha1
kind: SqlInstance
metadata:
  name: sql-e2e
  namespace: mssql-e2e
spec:
  mode: SingleNode
  version: "2022"
  acceptEula: true
  edition: Express
  saPasswordSecretRef:
    name: mssql-sa-password
    key: password
  storage:
    data:
      size: 2Gi
      storageClassName: standard
    log:
      size: 1Gi
      storageClassName: standard
  resources:
    requests:
      cpu: "250m"
      memory: "1500Mi"
    limits:
      memory: "2500Mi"
  service:
    type: ClusterIP
    port: 1433
