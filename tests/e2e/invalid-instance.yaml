# Must be rejected by the validating webhook: no memory bound. The schema accepts it, so the
# rejection shows that the webhook is wired.
apiVersion: mssql-operator.evariops.com/v1alpha1
kind: SqlInstance
metadata:
  name: sql-invalid
  namespace: mssql-e2e
spec:
  mode: SingleNode
  version: "2022"
  acceptEula: true
  edition: Express
  saPasswordSecretRef:
    name: mssql-sa-password
    key: password
  storage:
    data:
      size: 1Gi
      storageClassName: standard
  service:
    type: ClusterIP
    port: 1433
