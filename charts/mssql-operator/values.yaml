# With viewApi.enabled (the default) the operator also serves an aggregated APIService.
# A single replica then becomes a cluster-wide single point of failure: while it is down, its
# discovery fails, and Kubernetes refuses to finish the deletion of ANY namespace
# (NamespaceDeletionDiscoveryFailure) — not just the ones holding SQL Server. Combined with
# webhook.failurePolicy=Fail, no CRD can be created or updated either, so an operator rollout is the
# worst possible moment for an incident.
#
# Run at least 2 replicas (leader election makes it safe: only the leader reconciles, the others
# serve admission and the view API), and give the pod a priorityClassName so it is not the first
# evicted under node pressure. Set viewApi.enabled=false if you do not want that coupling at all.
replicaCount: 2

# Scheduling priority for the operator pod. Recommended when viewApi is enabled: the
# aggregated API of a cluster is not a best-effort workload.
priorityClassName: ""
# Or let the chart create one (named after the release), used when priorityClassName is
# empty. Applies to the operator and breakout pods.
priorityClass:
  create: false
  value: 1000000

image:
  # Operator image published by the release workflow (ghcr.io/<owner>/<repo>, lowercased).
  repository: ghcr.io/evariops/mssql-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# 256Mi was tight for a large fleet (relists, GitHub caches, in-memory dedup maps).
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

nodeSelector: {}
tolerations: []
# When left empty, the replicas prefer distinct nodes (preferred pod anti-affinity on
# kubernetes.io/hostname) — two replicas on one node are no high availability.
# They also prefer nodes without SQL Server pods: a lost node then takes a SQL pod or the
# operator leader, rarely both, and the new leader is elected while the SQL pods are still reachable.
# Keep that preference when you set your own affinity.
affinity: {}
# When empty, the replicas are spread over topology.kubernetes.io/zone (ScheduleAnyway: never
# keeps a pod Pending), so a zone reboot or loss does not take both. A list here replaces that default.
topologySpreadConstraints: []

logLevel: Information
# Simple (one line per entry) or json (structured, for log pipelines). Both carry the
# per-reconcile scope (kind, key, reconcileId).
logFormat: simple

# Reconciliation settings (bound to the operator's Operator configuration section).
operator:
  # Concurrent reconcile workers per kind.
  workerCount: 2
  # Managed StatefulSets allowed to be rolling out at once before a further pod-template
  # change (a SQL Server restart) waits. The slots are reserved in the
  # mssql-operator-rollout-slots Lease; one busy for more than 30 min no longer counts (RolloutStuck).
  maxConcurrentRestarts: 1
  # Approval holds an in-place cumulative update that only comes from a moved operator
  # default until the resource carries mssql-operator.evariops.com/approve-engine-upgrade=<new CU>
  # (e.g. CU10);
  # Automatic applies it. A build the spec pins is always applied.
  engineUpgradePolicy: Approval
  # Registries spec.image may pull from (prefix match). mcr.microsoft.com/ is always
  # allowed (configuration binding appends to the built-in default); "*" lifts the restriction.
  allowedImageRegistries: []
  # Ceiling of the safety levels. Each AG runs at the level of its annotation
  # mssql-operator.evariops.com/safety-level (0 without), capped here; the next level runs in Shadow.
  # 1: registry, epoch and SQL stamps; 2: quorum watchdog, elections, listener routing by pod name.
  safetyLevelMax: 1
  # Per-endpoint circuit breakers — Off, Shadow (logged only) or Enforce (a connection
  # to an endpoint seen down moments ago fails at once).
  targetCircuitBreakers: Shadow
  # After the demotion of the primary, a planned failover checks that the target holds its
  # whole log — Off, Shadow (an event, the failover goes on) or Enforce (the failover is rolled back).
  plannedFailoverLsnCheck: Shadow
  # The actuation gateway.
  automation:
    # Ceiling of every resource's spec.automation.mode: Observe, Plan or Apply. Plan or Observe here
    # holds every disruptive and destructive action of the cluster, whatever the resources say.
    maxMode: Apply
    # Destructive actions pre-authorized by spec.automation.preAuthorized that the whole operator may
    # run in an hour (on top of one per resource and per hour). 0 makes each of them wait for approval.
    maxDestructivePerHour: 3

# HTTP endpoint serving health probes (/healthz, /readyz) and Prometheus metrics (always on).
metrics:
  port: 8080

# Validating admission webhook. When enabled, the chart generates a self-signed CA + serving
# certificate at install time (reused across upgrades via a lookup of the existing Secret), so no
# external cert-manager dependency and no private keys committed to the repo.
webhook:
  enabled: true
  # Let cert-manager issue and rotate the serving certificate and inject the CA
  # bundle (GitOps-safe — the default helm-generated CA relies on `lookup`, which is empty
  # during `helm template`/ArgoCD renders and would break admission on every sync).
  #
  # With the built-in (non cert-manager) certificate, `helm upgrade` REUSES the existing
  # Secret — it never regenerated it, so the self-signed cert simply expired one year after install.
  # With failurePolicy: Fail that rejects every CRD write cluster-wide (including the operator's own
  # finalizer patches, so deletions hang), and the same certificate serves the aggregated APIService,
  # whose discovery failure blocks the deletion of every namespace. The chart now regenerates the cert
  # when it is within certRenewBeforeDays of expiry. cert-manager remains the recommended option.
  certManager:
    enabled: false
  # Regenerate the built-in serving certificate when it expires in fewer than this many days.
  certRenewBeforeDays: 30
  # In-container HTTPS port Kestrel serves the webhook on (the Service still exposes 443).
  port: 9443
  # Fail = CR create/update is rejected if the operator is unreachable (validation enforced);
  # Ignore = admission proceeds when the webhook is down (availability over enforcement).
  failurePolicy: Fail

# Aggregated read-only API (view.mssql-operator.evariops.com): serves live per-item detail (per-database TDE state,
# per-procedure deployment, ...) computed from SQL on demand, never stored in etcd (docs/reference/operator.md#view-api).
# Registered as a Kubernetes APIService so plain `kubectl get tdedatabasestates` works. Reuses the
# webhook serving cert/CA, so it requires webhook.enabled = true.
viewApi:
  enabled: true

# Operator → SQL Server connection TLS. Defaults preserve out-of-box behaviour with the
# mssql image's self-signed pod certificate: traffic is encrypted (Mandatory) but the server cert is
# NOT authenticated (trustServerCertificate: true), so an on-path attacker inside the cluster could
# MITM the connection and capture the sa credential. The operator logs a warning at startup while
# validation is off.
#
# To authenticate the servers:
#   1. give the SQL pods a certificate: spec.tls.secretName on the SqlInstance (instanceTemplate.tls
#      on an availability group), a kubernetes.io/tls Secret whose SANs cover the names the operator
#      connects to (<instance>.<ns>.svc.cluster.local; *.<ag>-headless.<ns>.svc.cluster.local);
#   2. let the operator trust its issuer: caSecretName below (a Secret holding the CA in ca.crt);
#   3. set trustServerCertificate: false (and encrypt: Strict on SQL Server 2022+).
sqlConnection:
  encrypt: Mandatory             # Optional | Mandatory | Strict
  trustServerCertificate: true   # set false (with the knobs below) to authenticate the SQL server cert
  hostNameInCertificate: ""      # expected SAN/CN when it differs from the pod FQDN
  serverCertificate: ""          # in-container path to a PEM/DER cert to validate against (Encrypt=Strict)
  caSecretName: ""               # Secret (operator namespace) with the CA that issued the SQL pods' certificates
  caSecretKey: ca.crt

# Split-brain fencing controller (RWO PVC breakout). Enabled by default: it's an essential recovery
# component when a node dies and RWO volumes stay attached to the dead node.
breakout:
  enabled: true
  # Run it in its own Deployment and ServiceAccount (true), so the identity that taints
  # nodes and detaches volumes is not the one serving the webhook and the aggregated API; false runs
  # it inside the operator pods, whose ClusterRole then gains node updates.
  dedicated: true
  replicaCount: 2               # leader-elected: one replica fences, the other stands by
  # Same default as topologySpreadConstraints above, for the breakout replicas.
  topologySpreadConstraints: []
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # Safety net only — the loop wakes on the watch of the pods in Terminating.
  controlLoopPeriodSeconds: 10
  terminatingThresholdSeconds: 30
  nodeReadyGracePeriodSeconds: 60
  # volumeattachment = real fencing by deleting VolumeAttachments off the dead node;
  # none = dry-run (emits events, performs no destructive action) — use to observe before enabling.
  fencingDriver: volumeattachment
  maxConcurrentFencing: 3
  # CSI drivers whose detach really withdraws a lost node's access to the data, such as
  # network block storage with attachRequired: true (e.g. ebs.csi.aws.com). A pod stuck on a lost
  # node is relocated automatically only when every one of its volumes uses one of them; otherwise
  # its owner raises NeedsAttention (ReplicaOnLostNode / InstanceOnLostNode) and a human decides.
  # Never list a driver whose detach leaves the node able to write (NFS, node-local storage).
  trustedFencingCsiDrivers: []
  # How long the node must stay NotReady, its Lease not renewed, before that relocation.
  relocationDelaySeconds: 600

# NetworkPolicy for the OPERATOR pod. Standard networking.k8s.io API (any CNI).
# Enabled by default — egress is restricted to DNS, the API server, SQL (1433/5022) and
# (optionally) external HTTPS, so a compromised operator cannot freely exfiltrate or pivot. No-op on
# CNIs that don't enforce NetworkPolicy. Set enabled: false if your cluster uses a non-standard
# API-server port or needs egress this policy doesn't list.
networkPolicy:
  enabled: true
  # Optional 'from' selectors to tighten ingress; empty = any source on that port.
  webhookFrom: []
  metricsFrom: []
  # Restrict the webhook/aggregated-API port to the API server addresses (apiServerCidrs, or
  # the endpoints of the default/kubernetes Service when the chart can read them). Opt-in: on some
  # managed clusters (AKS: konnectivity) the calls come from elsewhere, and a wrong allow-list
  # rejects every CR write (failurePolicy: Fail).
  webhookFromApiServerOnly: false
  # API server addresses (CIDRs). Empty = read from the endpoints of the default/kubernetes
  # Service at install time; when they cannot be read (helm template, ArgoCD), egress to the API
  # server ports stays open to every destination.
  apiServerCidrs: []
  # Open egress 443 to any destination for GitHub stored-procedure sources / S3 TDE backups. With
  # false, port 443 only reaches the API server (when its addresses are known).
  allowExternalHttps: true

# API Priority and Fairness (cluster-scoped FlowSchemas and PriorityLevelConfigurations).
# Control and status writes of the operator get their own priority level; its events a small one.
apiPriorityAndFairness:
  enabled: false
  controlShares: 40
  eventShares: 5

# Reference alert rules (PrometheusRule, prometheus-operator).
prometheusRule:
  enabled: false
  labels: {}
  # An AG not health-checked for this long is an operator that is blind to its primary.
  agStaleSeconds: 120
