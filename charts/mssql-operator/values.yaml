# With viewApi.enabled (the default) the operator also serves an aggregated APIService.
# A single replica then becomes a cluster-wide single point of failure: while it is down, its
# discovery fails, and Kubernetes refuses to finish the deletion of ANY namespace
# (NamespaceDeletionDiscoveryFailure) — not just the ones holding SQL Server. Combined with
# webhook.failurePolicy=Fail, no CRD can be created or updated either, so an operator rollout is the
# worst possible moment for an incident.
#
# Run at least 2 replicas (leader election makes it safe: only the leader reconciles, the others
# serve admission and the view API), and give the pod a priorityClassName so it is not the first
# evicted under node pressure. Set viewApi.enabled=false if you do not want that coupling at all.
replicaCount: 2

# Scheduling priority for the operator pod. Recommended when viewApi is enabled: the
# aggregated API of a cluster is not a best-effort workload.
priorityClassName: ""

image:
  # Operator image published by the release workflow (ghcr.io/<owner>/<repo>, lowercased).
  repository: ghcr.io/evariops/mssql-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

logLevel: Information

# HTTP endpoint serving health probes (/healthz, /readyz) and Prometheus metrics (always on).
metrics:
  port: 8080

# Validating admission webhook. When enabled, the chart generates a self-signed CA + serving
# certificate at install time (reused across upgrades via a lookup of the existing Secret), so no
# external cert-manager dependency and no private keys committed to the repo.
webhook:
  enabled: true
  # Let cert-manager issue and rotate the serving certificate and inject the CA
  # bundle (GitOps-safe — the default helm-generated CA relies on `lookup`, which is empty
  # during `helm template`/ArgoCD renders and would break admission on every sync).
  #
  # With the built-in (non cert-manager) certificate, `helm upgrade` REUSES the existing
  # Secret — it never regenerated it, so the self-signed cert simply expired one year after install.
  # With failurePolicy: Fail that rejects every CRD write cluster-wide (including the operator's own
  # finalizer patches, so deletions hang), and the same certificate serves the aggregated APIService,
  # whose discovery failure blocks the deletion of every namespace. The chart now regenerates the cert
  # when it is within certRenewBeforeDays of expiry. cert-manager remains the recommended option.
  certManager:
    enabled: false
  # Regenerate the built-in serving certificate when it expires in fewer than this many days.
  certRenewBeforeDays: 30
  # In-container HTTPS port Kestrel serves the webhook on (the Service still exposes 443).
  port: 9443
  # Fail = CR create/update is rejected if the operator is unreachable (validation enforced);
  # Ignore = admission proceeds when the webhook is down (availability over enforcement).
  failurePolicy: Fail

# Aggregated read-only API (view.mssql-operator.evariops.com): serves live per-item detail (per-database TDE state,
# per-procedure deployment, ...) computed from SQL on demand, never stored in etcd.
# Registered as a Kubernetes APIService so plain `kubectl get tdedatabasestates` works. Reuses the
# webhook serving cert/CA, so it requires webhook.enabled = true.
viewApi:
  enabled: true

# Operator → SQL Server connection TLS. Defaults preserve out-of-box behaviour with the
# mssql image's self-signed pod certificate: traffic is encrypted (Mandatory) but the server cert is
# NOT authenticated (trustServerCertificate: true), so an on-path attacker inside the cluster could
# MITM the connection and capture the sa credential. To authenticate the server, set encrypt: Strict
# and give the SQL pods a certificate the operator trusts (serverCertificate / hostNameInCertificate).
# The operator logs a warning at startup while validation is off.
sqlConnection:
  encrypt: Mandatory             # Optional | Mandatory | Strict
  trustServerCertificate: true   # set false (with the knobs below) to authenticate the SQL server cert
  hostNameInCertificate: ""      # expected SAN/CN when it differs from the pod FQDN
  serverCertificate: ""          # in-container path to a PEM/DER cert to validate against (Encrypt=Strict)

# Split-brain fencing controller (RWO PVC breakout). Runs in-process inside the operator pod, so
# the operator's ClusterRole gains node/volume-fencing permissions. Enabled by default: it's an
# essential recovery component when a node dies and RWO volumes stay attached to the dead node.
breakout:
  enabled: true
  controlLoopPeriodSeconds: 5
  terminatingThresholdSeconds: 30
  nodeReadyGracePeriodSeconds: 60
  # volumeattachment = real fencing by deleting VolumeAttachments off the dead node;
  # none = dry-run (emits events, performs no destructive action) — use to observe before enabling.
  fencingDriver: volumeattachment
  maxConcurrentFencing: 3

# NetworkPolicy for the OPERATOR pod. Standard networking.k8s.io API (any CNI).
# Enabled by default — egress is restricted to DNS, the API server, SQL (1433/5022) and
# (optionally) external HTTPS, so a compromised operator cannot freely exfiltrate or pivot. No-op on
# CNIs that don't enforce NetworkPolicy. Set enabled: false if your cluster uses a non-standard
# API-server port or needs egress this policy doesn't list.
networkPolicy:
  enabled: true
  # Optional 'from' selectors to tighten ingress; empty = any source on that port.
  webhookFrom: []
  metricsFrom: []
  # Open egress 443 for GitHub stored-procedure sources / S3 TDE backups.
  allowExternalHttps: true
