replicaCount: 1

image:
  # Operator image published by the release workflow (ghcr.io/<owner>/<repo>, lowercased).
  repository: ghcr.io/evariops/mssql-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

logLevel: Information

# HTTP endpoint serving health probes (/healthz, /readyz) and Prometheus metrics (always on).
metrics:
  port: 8080

# Validating admission webhook. When enabled, the chart generates a self-signed CA + serving
# certificate at install time (reused across upgrades via a lookup of the existing Secret), so no
# external cert-manager dependency and no private keys committed to the repo.
webhook:
  enabled: true
  # In-container HTTPS port Kestrel serves the webhook on (the Service still exposes 443).
  port: 9443
  # Fail = CR create/update is rejected if the operator is unreachable (validation enforced);
  # Ignore = admission proceeds when the webhook is down (availability over enforcement).
  failurePolicy: Fail

# Aggregated read-only API (view.mssql-operator.evariops.com): serves live per-item detail (per-database TDE state,
# per-procedure deployment, ...) computed from SQL on demand, never stored in etcd.
# Registered as a Kubernetes APIService so plain `kubectl get tdedatabasestates` works. Reuses the
# webhook serving cert/CA, so it requires webhook.enabled = true.
viewApi:
  enabled: true

# Split-brain fencing controller (RWO PVC breakout). Runs in-process inside the operator pod, so
# the operator's ClusterRole gains node/volume-fencing permissions. Enabled by default: it's an
# essential recovery component when a node dies and RWO volumes stay attached to the dead node.
breakout:
  enabled: true
  controlLoopPeriodSeconds: 5
  terminatingThresholdSeconds: 30
  nodeReadyGracePeriodSeconds: 60
  # volumeattachment = real fencing by deleting VolumeAttachments off the dead node;
  # none = dry-run (emits events, performs no destructive action) — use to observe before enabling.
  fencingDriver: volumeattachment
  maxConcurrentFencing: 3
