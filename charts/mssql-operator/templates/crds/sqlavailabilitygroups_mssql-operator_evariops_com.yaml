apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqlavailabilitygroups.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlAvailabilityGroup
    listKind: SqlAvailabilityGroupList
    plural: sqlavailabilitygroups
    singular: sqlavailabilitygroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.primaryReplica
      name: Primary
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              edition:
                default: Enterprise
                description: Standard | Enterprise — determines constraints and available features.
                type: string
              replicas:
                description: Replica topology (count, sync mode, overrides).
                properties:
                  count:
                    default: 3
                    description: 'Total number of replicas. Standard: must be 2. Enterprise: 2-9.'
                    format: int32
                    type: integer
                  synchronousCount:
                    default: 2
                    description: Number of replicas in SYNCHRONOUS_COMMIT mode (including primary).
                    format: int32
                    type: integer
                  requiredSynchronizedSecondariesToCommit:
                    default: 1
                    description: Number of synchronized secondaries required before commit returns. 0 = read-scale, 1+ = data protection.
                    format: int32
                    type: integer
                  overrides:
                    description: Per-replica overrides (by ordinal index).
                    items:
                      properties:
                        ordinal:
                          description: Pod ordinal index (0-based).
                          format: int32
                          type: integer
                        availabilityMode:
                          description: SynchronousCommit | AsynchronousCommit.
                          type: string
                        readableSecondary:
                          description: 'Enterprise only: No | ReadOnly | All.'
                          type: string
                        backupPriority:
                          description: 'Enterprise only: backup priority 0-100.'
                          format: int32
                          type: integer
                        sessionTimeout:
                          description: Session timeout in seconds.
                          format: int32
                          type: integer
                      type: object
                    type: array
                type: object
              replicaDefaults:
                description: Default settings applied to all replicas unless overridden.
                properties:
                  availabilityMode:
                    default: SynchronousCommit
                    type: string
                  readableSecondary:
                    default: All
                    type: string
                  seedingMode:
                    default: Automatic
                    type: string
                  backupPriority:
                    default: 50
                    format: int32
                    type: integer
                  sessionTimeout:
                    default: 10
                    format: int32
                    type: integer
                type: object
              instanceTemplate:
                description: SQL Server instance template (image, resources, storage).
                properties:
                  version:
                    default: "2022"
                    type: string
                  image:
                    type: string
                  imageTag:
                    type: string
                  memory:
                    properties:
                      total:
                        description: Total memory allocated to the pod (e.g. "16Gi"). Sets both requests and limits for Guaranteed QoS.
                        type: string
                      systemReserve:
                        default: 2Gi
                        description: Memory reserved for OS, SQL Agent, sidecars. Default "2Gi". SQL max memory = Total - SystemReserve.
                        type: string
                      minMemory:
                        description: "Optional: sp_configure 'min server memory' (e.g. \"8Gi\"). If omitted, SQL Server uses its default (0)."
                        type: string
                    type: object
                  resources:
                    properties:
                      requests:
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                          ephemeralStorage:
                            description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                            type: string
                        type: object
                      limits:
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                          ephemeralStorage:
                            description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                            type: string
                        type: object
                      cpuPinning:
                        type: boolean
                    type: object
                  storage:
                    properties:
                      data:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      sysDb:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      log:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      tempDb:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      backup:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      errorLogs:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      certBackups:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                    type: object
                  configurationRef:
                    properties:
                      name:
                        type: string
                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  tolerations:
                    items:
                      properties:
                        effect:
                          type: string
                        key:
                          type: string
                        operator:
                          type: string
                        tolerationSeconds:
                          format: int64
                          type: integer
                        value:
                          type: string
                      type: object
                    type: array
                  priorityClassName:
                    type: string
                  runtimeClassName:
                    type: string
                  shutdown:
                    description: 'Pod shutdown behaviour: grace period for clean checkpointing.'
                    properties:
                      gracePeriodSeconds:
                        default: 180
                        description: terminationGracePeriodSeconds — SQL Server needs time to checkpoint; the k8s default of 30s SIGKILLs sqlservr mid-checkpoint and forces a long crash-recovery.
                        format: int64
                        type: integer
                    type: object
                  podSecurityContext:
                    properties:
                      appArmorProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      fsGroup:
                        format: int64
                        type: integer
                      fsGroupChangePolicy:
                        type: string
                      runAsGroup:
                        format: int64
                        type: integer
                      runAsNonRoot:
                        type: boolean
                      runAsUser:
                        format: int64
                        type: integer
                      seLinuxChangePolicy:
                        type: string
                      seLinuxOptions:
                        properties:
                          level:
                            type: string
                          role:
                            type: string
                          type:
                            type: string
                          user:
                            type: string
                        type: object
                      seccompProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      supplementalGroups:
                        items:
                          format: int64
                          type: integer
                        type: array
                      supplementalGroupsPolicy:
                        type: string
                      sysctls:
                        items:
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                          type: object
                        type: array
                      windowsOptions:
                        properties:
                          gmsaCredentialSpec:
                            type: string
                          gmsaCredentialSpecName:
                            type: string
                          hostProcess:
                            type: boolean
                          runAsUserName:
                            type: string
                        type: object
                    type: object
                  securityContext:
                    properties:
                      allowPrivilegeEscalation:
                        type: boolean
                      appArmorProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      capabilities:
                        properties:
                          add:
                            items:
                              type: string
                            type: array
                          drop:
                            items:
                              type: string
                            type: array
                        type: object
                      privileged:
                        type: boolean
                      procMount:
                        type: string
                      readOnlyRootFilesystem:
                        type: boolean
                      runAsGroup:
                        format: int64
                        type: integer
                      runAsNonRoot:
                        type: boolean
                      runAsUser:
                        format: int64
                        type: integer
                      seLinuxOptions:
                        properties:
                          level:
                            type: string
                          role:
                            type: string
                          type:
                            type: string
                          user:
                            type: string
                        type: object
                      seccompProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      windowsOptions:
                        properties:
                          gmsaCredentialSpec:
                            type: string
                          gmsaCredentialSpecName:
                            type: string
                          hostProcess:
                            type: boolean
                          runAsUserName:
                            type: string
                        type: object
                    type: object
                type: object
              hadrCertificate:
                description: HADR certificate for endpoint authentication (X.509).
                properties:
                  source:
                    default: Generate
                    description: Generate | Import.
                    type: string
                  model:
                    default: PerReplica
                    description: PerReplica (each replica gets its own cert, public keys cross-imported).
                    type: string
                  generate:
                    properties:
                      subject:
                        type: string
                      expiryDate:
                        type: string
                      keyLength:
                        default: 2048
                        format: int32
                        type: integer
                    type: object
                  importFrom:
                    properties:
                      secretName:
                        type: string
                      certificateKey:
                        default: certificate.cer
                        type: string
                      privateKeyKey:
                        default: private-key.pvk
                        type: string
                      passwordKey:
                        type: string
                    type: object
                  secretName:
                    description: K8s Secret where the operator stores/reads the certificate.
                    type: string
                  encryptionPasswordSecretRef:
                    description: Password used to encrypt the private key during export.
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                    type: object
                type: object
              endpoint:
                description: Database mirroring endpoint configuration.
                properties:
                  name:
                    default: Hadr_endpoint
                    type: string
                    x-kubernetes-validations:
                    - message: 'endpoint.name is immutable in v1alpha1: recreating the mirroring endpoint interrupts replication'
                      rule: self == oldSelf
                  port:
                    default: 5022
                    format: int32
                    maximum: 65535.0
                    minimum: 1024.0
                    type: integer
                    x-kubernetes-validations:
                    - message: 'endpoint.port is immutable in v1alpha1: recreating the mirroring endpoint interrupts replication'
                      rule: self == oldSelf
                  encryptionAlgorithm:
                    default: AES
                    type: string
                type: object
              masterKeyPasswordSecretRef:
                description: Secret containing the Database Master Key password.
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              saPasswordSecretRef:
                description: Secret containing the SA password for all replicas.
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              machineKeySecretRef:
                description: Secret containing the machine key for all replicas (migration scenario).
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              smkBackupPasswordSecretRef:
                description: Secret containing the SMK backup encryption password.
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              operatorLoginSecretRef:
                description: Optional dedicated SQL login for operator (instead of SA).
                properties:
                  name:
                    description: Secret name containing login and password keys.
                    type: string
                  loginKey:
                    default: login
                    description: Key in the Secret holding the SQL login name.
                    type: string
                  passwordKey:
                    default: password
                    description: Key in the Secret holding the SQL password.
                    type: string
                type: object
              listener:
                description: Read/Write listener service.
                properties:
                  port:
                    default: 1433
                    format: int32
                    type: integer
                  service:
                    properties:
                      type:
                        default: ClusterIP
                        pattern: ClusterIP|NodePort|LoadBalancer|ExternalName
                        type: string
                      port:
                        default: 1433
                        format: int32
                        maximum: 65535.0
                        minimum: 1024.0
                        type: integer
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                type: object
              readOnlyListener:
                description: Read-Only listener service (Enterprise only, ignored for Standard).
                properties:
                  port:
                    default: 1433
                    format: int32
                    type: integer
                  service:
                    properties:
                      type:
                        default: ClusterIP
                        pattern: ClusterIP|NodePort|LoadBalancer|ExternalName
                        type: string
                      port:
                        default: 1433
                        format: int32
                        maximum: 65535.0
                        minimum: 1024.0
                        type: integer
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                type: object
              readOnlyRouting:
                description: Read-Only routing configuration (Enterprise only).
                properties:
                  enabled:
                    type: boolean
                type: object
              failover:
                description: Failover behavior and split-brain protection.
                properties:
                  operatorManaged:
                    default: true
                    description: Whether the operator manages failovers (always MANUAL at SQL Server level).
                    type: boolean
                  healthCheckIntervalSeconds:
                    default: 10
                    format: int32
                    type: integer
                  healthCheckTimeoutSeconds:
                    default: 30
                    format: int32
                    type: integer
                  failoverConditionLevel:
                    default: 3
                    description: '1-5: severity level triggering operator failover. 1=ServerDown, 2=+Unresponsive, 3=+CriticalErrors, 4=+ModerateErrors, 5=+AnyFailure.'
                    format: int32
                    type: integer
                  primaryUnreachableThreshold:
                    default: 3
                    description: 'Consecutive health passes without a reachable primary before the operator acts (drains the writer label, promotes a secondary). One missed pass is a monitoring blip, not an outage.'
                    format: int32
                    type: integer
                  splitBrainProtection:
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      fencingStrategy:
                        default: NetworkIsolation
                        description: NetworkIsolation | ManualApproval | External.
                        type: string
                      fencingTimeoutSeconds:
                        default: 60
                        format: int32
                        type: integer
                    type: object
                  preferredTargets:
                    description: Preferred failover targets by ordinal.
                    items:
                      properties:
                        ordinal:
                          format: int32
                          type: integer
                      type: object
                    type: array
                  allowAutomaticDataLossFailover:
                    description: Allow operator to automatically perform force-failover-allow-data-loss.
                    type: boolean
                  autoResumeDataMovement:
                    default: true
                    description: After failover, automatically resume suspended databases.
                    type: boolean
                  autoReconfigurePrimary:
                    default: true
                    description: After failover, automatically update pod labels.
                    type: boolean
                type: object
              updateStrategy:
                description: Rolling update strategy (AG-aware).
                properties:
                  type:
                    default: RollingUpdate
                    pattern: RollingUpdate|OnDelete
                    type: string
                  rollingUpdate:
                    properties:
                      maxUnavailable:
                        default: 1
                        format: int32
                        maximum: 9.0
                        minimum: 1.0
                        type: integer
                      preUpdateBackup:
                        default: true
                        type: boolean
                      healthCheckTimeoutSeconds:
                        default: 300
                        format: int32
                        type: integer
                      pauseBetweenPodsSeconds:
                        default: 60
                        format: int32
                        type: integer
                      updateSecondariesFirst:
                        default: true
                        type: boolean
                      failoverBeforePrimaryUpdate:
                        default: true
                        type: boolean
                    type: object
                type: object
              antiAffinity:
                description: Pod anti-affinity rules.
                properties:
                  requiredAntiAffinityWith:
                    items:
                      properties:
                        instanceName:
                          type: string
                        topologyKey:
                          default: kubernetes.io/hostname
                          type: string
                      type: object
                    type: array
                  preferredAntiAffinityWith:
                    items:
                      properties:
                        weight:
                          default: 100
                          format: int32
                          type: integer
                        instanceName:
                          type: string
                        topologyKey:
                          default: kubernetes.io/hostname
                          type: string
                      type: object
                    type: array
                  requiredSelfAntiAffinity:
                    properties:
                      topologyKey:
                        default: kubernetes.io/hostname
                        type: string
                    type: object
                  preferredSelfAntiAffinity:
                    properties:
                      weight:
                        default: 100
                        format: int32
                        type: integer
                      topologyKey:
                        default: kubernetes.io/hostname
                        type: string
                    type: object
                type: object
              networkPolicy:
                description: CiliumNetworkPolicy configuration for SQL + mirroring ports.
                properties:
                  enabled:
                    type: boolean
                  allowedNamespaces:
                    items:
                      type: string
                    type: array
                  operatorNamespace:
                    description: "Deprecated — the operator namespace is sourced from the operator's own POD_NAMESPACE env var, not from each user CR (a wrong value here cut the operator off from its instance). Ignored by the controller."
                    type: string
                type: object
              backupPreference:
                description: 'Enterprise only: AUTOMATED_BACKUP_PREFERENCE. Primary | Secondary | Prefer_Primary | None.'
                type: string
            type: object
          status:
            properties:
              phase:
                default: Pending
                type: string
              observedGeneration:
                format: int64
                type: integer
              edition:
                type: string
              clusterType:
                default: None
                type: string
              primaryReplica:
                type: string
              primaryUnreachableCount:
                description: Consecutive health passes where no primary answered. Reset on the first healthy pass; failover actions trigger only at the spec threshold.
                format: int32
                type: integer
              primaryEndpoint:
                type: string
              readOnlyEndpoint:
                type: string
              memory:
                properties:
                  podLimitMb:
                    description: Pod resources.limits.memory in MB.
                    format: int32
                    type: integer
                  sqlMaxMemoryMb:
                    description: sp_configure 'max server memory' value applied in MB.
                    format: int32
                    type: integer
                  sqlMinMemoryMb:
                    description: sp_configure 'min server memory' value applied in MB (0 if not set).
                    format: int32
                    type: integer
                  systemReserveMb:
                    description: System reserve in MB.
                    format: int32
                    type: integer
                  aligned:
                    description: True if the SQL Server configuration matches the calculated value.
                    type: boolean
                type: object
              replicas:
                items:
                  properties:
                    name:
                      type: string
                    role:
                      default: Unknown
                      type: string
                    availabilityMode:
                      default: Unknown
                      type: string
                    synchronizationState:
                      default: Unknown
                      type: string
                    connectionState:
                      default: Unknown
                      type: string
                    isFailoverReady:
                      type: boolean
                    readable:
                      type: boolean
                    listenerReady:
                      default: none
                      type: string
                  type: object
                type: array
              databaseSummary:
                description: Aggregated summary of SqlAvailabilityGroupDatabase CRDs referencing this AG.
                properties:
                  total:
                    format: int32
                    type: integer
                  synchronized:
                    format: int32
                    type: integer
                  synchronizing:
                    format: int32
                    type: integer
                  suspended:
                    format: int32
                    type: integer
                  failed:
                    format: int32
                    type: integer
                type: object
              certificates:
                items:
                  properties:
                    replicaName:
                      type: string
                    name:
                      type: string
                    thumbprint:
                      type: string
                    expiryDate:
                      format: date-time
                      type: string
                    trustedByReplicas:
                      items:
                        type: string
                      type: array
                  type: object
                type: array
              lastFailover:
                properties:
                  timestamp:
                    format: date-time
                    type: string
                  from:
                    type: string
                  to:
                    type: string
                  reason:
                    type: string
                  dataLoss:
                    type: boolean
                type: object
              rollingUpdate:
                description: Progress of an in-flight AG-aware rolling update.
                properties:
                  phase:
                    default: Idle
                    description: Idle|Planning|UpdatingSecondary|FailingOverForUpdate|UpdatingPrimary|Completing|Failed.
                    type: string
                  currentPod:
                    description: The pod currently being updated (deleted and awaited), if any.
                    type: string
                  step:
                    description: 'Fine-grained step for the current pod: DeletingPod|WaitingHealthy|Pausing.'
                    type: string
                  totalPods:
                    format: int32
                    type: integer
                  updatedPods:
                    format: int32
                    type: integer
                  startedAt:
                    format: date-time
                    type: string
                  currentStepStartedAt:
                    format: date-time
                    type: string
                  nextActionAfter:
                    description: Earliest time the next pod may be started (pauseBetweenPodsSeconds gate).
                    format: date-time
                    type: string
                  targetRevision:
                    description: The StatefulSet updateRevision this rollout converges toward.
                    type: string
                type: object
              readOnlyRoutingSignature:
                description: 'Signature of the read-only routing topology last applied to SQL Server (primary + readable secondaries + port). Lets the controller re-apply routing only when the topology actually changes (failover, replica add/remove, readability flip) instead of every cycle.'
                type: string
              conditions:
                items:
                  properties:
                    type:
                      maxLength: 316
                      type: string
                    status:
                      default: "False"
                      description: True | False | Unknown (metav1.ConditionStatus).
                      type: string
                    reason:
                      default: Unknown
                      description: PascalCase machine-readable reason (required by metav1.Condition).
                      maxLength: 1024
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The .metadata.generation the condition was computed against (metav1.Condition).
                      format: int64
                      type: integer
                    lastTransitionTime:
                      format: date-time
                      type: string
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}