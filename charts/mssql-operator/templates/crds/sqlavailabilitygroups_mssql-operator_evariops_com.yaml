apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqlavailabilitygroups.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlAvailabilityGroup
    listKind: SqlAvailabilityGroupList
    plural: sqlavailabilitygroups
    singular: sqlavailabilitygroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.primaryReplica
      name: Primary
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              edition:
                default: Enterprise
                description: Standard | Enterprise — determines constraints and available features.
                type: string
              replicas:
                description: Replica topology (count, sync mode, overrides).
                properties:
                  count:
                    default: 3
                    description: 'Total number of replicas. Standard: must be 2. Enterprise: 2-9.'
                    format: int32
                    type: integer
                    x-kubernetes-validations:
                    - message: 'spec.replicas.count is immutable: AG scale-out/in is not orchestrated. Recreate the AG to change the replica count.'
                      rule: self == oldSelf
                  synchronousCount:
                    default: 2
                    description: Number of replicas in SYNCHRONOUS_COMMIT mode (including primary).
                    format: int32
                    type: integer
                  requiredSynchronizedSecondariesToCommit:
                    default: 1
                    description: Number of synchronized secondaries required before commit returns. 0 = read-scale, 1+ = data protection.
                    format: int32
                    type: integer
                  requiredSyncFloor:
                    description: 'Durability floor: the operator will never lower REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT below this value to keep the group write-available. The operator lowers that setting when a synchronous secondary drops, so commits do not freeze — a trade of durability for availability. The README documented a "floor" to opt out of that trade; no such setting existed, and the lowering was unconditional, down to 0 (commits acknowledged by the primary alone). Deployments that must never weaken durability set this to 1: writes then block, loudly, instead of silently becoming non-durable.'
                    format: int32
                    type: integer
                  overrides:
                    description: Per-replica overrides (by ordinal index).
                    items:
                      properties:
                        ordinal:
                          description: Pod ordinal index (0-based).
                          format: int32
                          type: integer
                        availabilityMode:
                          description: SynchronousCommit | AsynchronousCommit.
                          type: string
                        readableSecondary:
                          description: 'Enterprise only: No | ReadOnly | All.'
                          type: string
                        backupPriority:
                          description: 'Enterprise only: backup priority 0-100.'
                          format: int32
                          type: integer
                        sessionTimeout:
                          description: Session timeout in seconds.
                          format: int32
                          type: integer
                      type: object
                    type: array
                type: object
              replicaDefaults:
                description: Default settings applied to all replicas unless overridden.
                properties:
                  availabilityMode:
                    default: SynchronousCommit
                    type: string
                  readableSecondary:
                    default: All
                    type: string
                  seedingMode:
                    default: Automatic
                    type: string
                  backupPriority:
                    default: 50
                    format: int32
                    type: integer
                  sessionTimeout:
                    default: 10
                    format: int32
                    type: integer
                type: object
              instanceTemplate:
                description: SQL Server instance template (image, resources, storage).
                properties:
                  version:
                    default: "2022"
                    type: string
                  image:
                    type: string
                  imageTag:
                    type: string
                  memory:
                    properties:
                      total:
                        description: Total memory allocated to the pod (e.g. "16Gi"). Sets both requests and limits for Guaranteed QoS.
                        type: string
                      systemReserve:
                        default: 2Gi
                        description: Memory reserved for OS, SQL Agent, sidecars. Default "2Gi". SQL max memory = Total - SystemReserve.
                        type: string
                      minMemory:
                        description: "Optional: sp_configure 'min server memory' (e.g. \"8Gi\"). If omitted, SQL Server uses its default (0)."
                        type: string
                    type: object
                  resources:
                    properties:
                      requests:
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                          ephemeralStorage:
                            description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                            type: string
                        type: object
                      limits:
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                          ephemeralStorage:
                            description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                            type: string
                        type: object
                      cpuPinning:
                        type: boolean
                    type: object
                  storage:
                    properties:
                      data:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      sysDb:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      log:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      tempDb:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      backup:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      errorLogs:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                      certBackups:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                            x-kubernetes-validations:
                            - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                              rule: self == oldSelf
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                    type: object
                  configurationRef:
                    properties:
                      name:
                        type: string
                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  tolerations:
                    items:
                      properties:
                        effect:
                          type: string
                        key:
                          type: string
                        operator:
                          type: string
                        tolerationSeconds:
                          format: int64
                          type: integer
                        value:
                          type: string
                      type: object
                    type: array
                  priorityClassName:
                    type: string
                  runtimeClassName:
                    type: string
                  shutdown:
                    description: 'Pod shutdown behaviour: grace period for clean checkpointing.'
                    properties:
                      gracePeriodSeconds:
                        default: 180
                        description: terminationGracePeriodSeconds — SQL Server needs time to checkpoint; the k8s default of 30s SIGKILLs sqlservr mid-checkpoint and forces a long crash-recovery.
                        format: int64
                        type: integer
                    type: object
                  probes:
                    description: Probe budgets.
                    properties:
                      readinessFailureThreshold:
                        default: 6
                        description: Consecutive readiness failures before the pod leaves the Service. Default 6 (≈1 min).
                        format: int32
                        maximum: 60.0
                        minimum: 1.0
                        type: integer
                      readinessTimeoutSeconds:
                        default: 10
                        description: Readiness probe timeout, also used as the sqlcmd login timeout (-l). Default 10s.
                        format: int32
                        maximum: 60.0
                        minimum: 1.0
                        type: integer
                      startupFailureThreshold:
                        default: 90
                        description: Startup probe failures (10s period) before the container is restarted. Default 90 (15 min), which is the budget for the master upgrade scripts of a cumulative update.
                        format: int32
                        maximum: 720.0
                        minimum: 1.0
                        type: integer
                      livenessFailureThreshold:
                        default: 5
                        description: Liveness failures (30s period) before the container is restarted. Default 5.
                        format: int32
                        maximum: 60.0
                        minimum: 1.0
                        type: integer
                    type: object
                  podSecurityContext:
                    properties:
                      appArmorProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      fsGroup:
                        format: int64
                        type: integer
                      fsGroupChangePolicy:
                        type: string
                      runAsGroup:
                        format: int64
                        type: integer
                      runAsNonRoot:
                        type: boolean
                      runAsUser:
                        format: int64
                        type: integer
                      seLinuxChangePolicy:
                        type: string
                      seLinuxOptions:
                        properties:
                          level:
                            type: string
                          role:
                            type: string
                          type:
                            type: string
                          user:
                            type: string
                        type: object
                      seccompProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      supplementalGroups:
                        items:
                          format: int64
                          type: integer
                        type: array
                      supplementalGroupsPolicy:
                        type: string
                      sysctls:
                        items:
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                          type: object
                        type: array
                      windowsOptions:
                        properties:
                          gmsaCredentialSpec:
                            type: string
                          gmsaCredentialSpecName:
                            type: string
                          hostProcess:
                            type: boolean
                          runAsUserName:
                            type: string
                        type: object
                    type: object
                  securityContext:
                    properties:
                      allowPrivilegeEscalation:
                        type: boolean
                      appArmorProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      capabilities:
                        properties:
                          add:
                            items:
                              type: string
                            type: array
                          drop:
                            items:
                              type: string
                            type: array
                        type: object
                      privileged:
                        type: boolean
                      procMount:
                        type: string
                      readOnlyRootFilesystem:
                        type: boolean
                      runAsGroup:
                        format: int64
                        type: integer
                      runAsNonRoot:
                        type: boolean
                      runAsUser:
                        format: int64
                        type: integer
                      seLinuxOptions:
                        properties:
                          level:
                            type: string
                          role:
                            type: string
                          type:
                            type: string
                          user:
                            type: string
                        type: object
                      seccompProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      windowsOptions:
                        properties:
                          gmsaCredentialSpec:
                            type: string
                          gmsaCredentialSpecName:
                            type: string
                          hostProcess:
                            type: boolean
                          runAsUserName:
                            type: string
                        type: object
                    type: object
                type: object
              hadrCertificate:
                description: HADR certificate for endpoint authentication (X.509).
                properties:
                  source:
                    default: Generate
                    description: Generate | Import.
                    type: string
                  model:
                    default: PerReplica
                    description: PerReplica (each replica gets its own cert, public keys cross-imported).
                    type: string
                  generate:
                    properties:
                      subject:
                        type: string
                      expiryDate:
                        type: string
                      keyLength:
                        default: 2048
                        format: int32
                        type: integer
                    type: object
                  importFrom:
                    properties:
                      secretName:
                        type: string
                      certificateKey:
                        default: certificate.cer
                        type: string
                      privateKeyKey:
                        default: private-key.pvk
                        type: string
                      passwordKey:
                        type: string
                    type: object
                  secretName:
                    description: K8s Secret where the operator stores/reads the certificate.
                    type: string
                  encryptionPasswordSecretRef:
                    description: Password used to encrypt the private key during export.
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                    type: object
                type: object
              endpoint:
                description: Database mirroring endpoint configuration.
                properties:
                  name:
                    default: Hadr_endpoint
                    type: string
                    x-kubernetes-validations:
                    - message: 'endpoint.name is immutable in v1alpha1: recreating the mirroring endpoint interrupts replication'
                      rule: self == oldSelf
                  port:
                    default: 5022
                    format: int32
                    maximum: 65535.0
                    minimum: 1024.0
                    type: integer
                    x-kubernetes-validations:
                    - message: 'endpoint.port is immutable in v1alpha1: recreating the mirroring endpoint interrupts replication'
                      rule: self == oldSelf
                  encryptionAlgorithm:
                    default: AES
                    type: string
                type: object
              masterKeyPasswordSecretRef:
                description: Secret containing the Database Master Key password.
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              saPasswordSecretRef:
                description: Secret containing the SA password for all replicas.
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              machineKeySecretRef:
                description: Secret containing the machine key for all replicas (migration scenario).
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              smkBackupPasswordSecretRef:
                description: Secret containing the SMK backup encryption password.
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              operatorLoginSecretRef:
                description: Optional dedicated SQL login for operator (instead of SA).
                properties:
                  name:
                    description: Secret name containing login and password keys.
                    type: string
                  loginKey:
                    default: login
                    description: Key in the Secret holding the SQL login name.
                    type: string
                  passwordKey:
                    default: password
                    description: Key in the Secret holding the SQL password.
                    type: string
                type: object
              listener:
                description: Read/Write listener service.
                properties:
                  port:
                    default: 1433
                    format: int32
                    type: integer
                  service:
                    properties:
                      type:
                        default: ClusterIP
                        pattern: ClusterIP|NodePort|LoadBalancer|ExternalName
                        type: string
                      port:
                        default: 1433
                        format: int32
                        maximum: 65535.0
                        minimum: 1024.0
                        type: integer
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                type: object
              readOnlyListener:
                description: Read-Only listener service (Enterprise only, ignored for Standard).
                properties:
                  port:
                    default: 1433
                    format: int32
                    type: integer
                  service:
                    properties:
                      type:
                        default: ClusterIP
                        pattern: ClusterIP|NodePort|LoadBalancer|ExternalName
                        type: string
                      port:
                        default: 1433
                        format: int32
                        maximum: 65535.0
                        minimum: 1024.0
                        type: integer
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                type: object
              readOnlyRouting:
                description: Read-Only routing configuration (Enterprise only).
                properties:
                  enabled:
                    type: boolean
                type: object
              failover:
                description: Failover behavior and split-brain protection.
                properties:
                  operatorManaged:
                    default: true
                    description: Whether the operator manages failovers (always MANUAL at SQL Server level).
                    type: boolean
                  healthCheckIntervalSeconds:
                    default: 10
                    format: int32
                    type: integer
                  healthCheckTimeoutSeconds:
                    default: 30
                    format: int32
                    type: integer
                  failoverConditionLevel:
                    default: 3
                    description: '1-5: severity level triggering operator failover. 1=ServerDown, 2=+Unresponsive, 3=+CriticalErrors, 4=+ModerateErrors, 5=+AnyFailure.'
                    format: int32
                    type: integer
                  primaryUnreachableThreshold:
                    default: 3
                    description: 'Consecutive health passes without a reachable primary before the operator acts (drains the writer label, promotes a secondary). One missed pass is a monitoring blip, not an outage.'
                    format: int32
                    type: integer
                  splitBrainProtection:
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      fencingStrategy:
                        default: NetworkIsolation
                        description: NetworkIsolation | ManualApproval | External.
                        type: string
                      fencingTimeoutSeconds:
                        default: 60
                        format: int32
                        type: integer
                    type: object
                  preferredTargets:
                    description: Preferred failover targets by ordinal.
                    items:
                      properties:
                        ordinal:
                          format: int32
                          type: integer
                      type: object
                    type: array
                  allowAutomaticDataLossFailover:
                    description: Allow operator to automatically perform force-failover-allow-data-loss.
                    type: boolean
                  maxDataLossKb:
                    description: Upper bound (KB of unsent/un-redone log) on the data loss an AUTOMATIC forced failover may accept. When the freshest eligible replica is further behind than this — or when the lag cannot be measured — the operator stops and asks for a human decision instead of silently discarding an unbounded amount of committed transactions. Unset = no bound (previous behaviour). Ignored on manual force-failover-to, which is an explicit decision.
                    format: int64
                    type: integer
                  autoResumeDataMovement:
                    default: true
                    description: After failover, automatically resume suspended databases.
                    type: boolean
                  autoReconfigurePrimary:
                    default: true
                    description: After failover, automatically update pod labels.
                    type: boolean
                type: object
              updateStrategy:
                description: Rolling update strategy (AG-aware).
                properties:
                  type:
                    default: RollingUpdate
                    pattern: RollingUpdate|OnDelete
                    type: string
                  rollingUpdate:
                    properties:
                      maxUnavailable:
                        default: 1
                        format: int32
                        maximum: 9.0
                        minimum: 1.0
                        type: integer
                      preUpdateBackup:
                        default: true
                        type: boolean
                      healthCheckTimeoutSeconds:
                        default: 300
                        format: int32
                        type: integer
                      pauseBetweenPodsSeconds:
                        default: 60
                        format: int32
                        type: integer
                      updateSecondariesFirst:
                        default: true
                        type: boolean
                      failoverBeforePrimaryUpdate:
                        default: true
                        type: boolean
                    type: object
                type: object
              antiAffinity:
                description: Pod anti-affinity rules.
                properties:
                  requiredAntiAffinityWith:
                    items:
                      properties:
                        instanceName:
                          type: string
                        topologyKey:
                          default: kubernetes.io/hostname
                          type: string
                      type: object
                    type: array
                  preferredAntiAffinityWith:
                    items:
                      properties:
                        weight:
                          default: 100
                          format: int32
                          type: integer
                        instanceName:
                          type: string
                        topologyKey:
                          default: kubernetes.io/hostname
                          type: string
                      type: object
                    type: array
                  requiredSelfAntiAffinity:
                    properties:
                      topologyKey:
                        default: kubernetes.io/hostname
                        type: string
                    type: object
                  preferredSelfAntiAffinity:
                    properties:
                      weight:
                        default: 100
                        format: int32
                        type: integer
                      topologyKey:
                        default: kubernetes.io/hostname
                        type: string
                    type: object
                type: object
              topologySpread:
                description: Topology spread & cross-instance placement. When neither this nor is set, AG replicas default to a preferred node+zone self-spread.
                properties:
                  self:
                    description: Spread THIS resource's own pods (e.g. AG replicas) across the topology. Selector is the resource identity label only (stable across in-place version upgrades).
                    properties:
                      node:
                        description: Spread across kubernetes.io/hostname. "Required" (DoNotSchedule) | "Preferred" (ScheduleAnyway) | null (off).
                        type: string
                      zone:
                        description: Spread across topology.kubernetes.io/zone. "Required" | "Preferred" | null.
                        type: string
                      maxSkew:
                        default: 1
                        description: Maximum allowed difference in pod count between topology domains. Default 1.
                        format: int32
                        type: integer
                      minDomains:
                        description: Minimum number of domains that must be occupied. Only honoured with a Required rule.
                        format: int32
                        type: integer
                    type: object
                  pool:
                    description: Spread the pods of ALL resources sharing spec.pool across the topology. Requires spec.pool to be set.
                    properties:
                      node:
                        description: Spread across kubernetes.io/hostname. "Required" (DoNotSchedule) | "Preferred" (ScheduleAnyway) | null (off).
                        type: string
                      zone:
                        description: Spread across topology.kubernetes.io/zone. "Required" | "Preferred" | null.
                        type: string
                      maxSkew:
                        default: 1
                        description: Maximum allowed difference in pod count between topology domains. Default 1.
                        format: int32
                        type: integer
                      minDomains:
                        description: Minimum number of domains that must be occupied. Only honoured with a Required rule.
                        format: int32
                        type: integer
                    type: object
                  poolAntiAffinity:
                    description: 'Strict cross-pool separation on the hostname (pod anti-affinity, not spread): no two pool members on the same node. "Required" | "Preferred". Requires spec.pool.'
                    type: string
                  constraints:
                    description: 'Escape hatch: raw native constraints appended verbatim (minDomains, matchLabelKeys, nodeAffinityPolicy, nodeTaintsPolicy, ...).'
                    items:
                      properties:
                        labelSelector:
                          properties:
                            matchExpressions:
                              items:
                                properties:
                                  key:
                                    type: string
                                  operator:
                                    type: string
                                  values:
                                    items:
                                      type: string
                                    type: array
                                type: object
                              type: array
                            matchLabels:
                              additionalProperties:
                                type: string
                              type: object
                          type: object
                        matchLabelKeys:
                          items:
                            type: string
                          type: array
                        maxSkew:
                          format: int32
                          type: integer
                        minDomains:
                          format: int32
                          type: integer
                        nodeAffinityPolicy:
                          type: string
                        nodeTaintsPolicy:
                          type: string
                        topologyKey:
                          type: string
                        whenUnsatisfiable:
                          type: string
                      type: object
                    type: array
                type: object
              pool:
                description: Cross-resource grouping label for pool-scoped spread / anti-affinity.
                type: string
              networkPolicy:
                description: CiliumNetworkPolicy configuration for SQL + mirroring ports.
                properties:
                  enabled:
                    type: boolean
                  allowedNamespaces:
                    items:
                      type: string
                    type: array
                  operatorNamespace:
                    description: "Deprecated — the operator namespace is sourced from the operator's own POD_NAMESPACE env var, not from each user CR (a wrong value here cut the operator off from its instance). Ignored by the controller."
                    type: string
                type: object
              backupPreference:
                description: 'Enterprise only: AUTOMATED_BACKUP_PREFERENCE. Primary | Secondary | Prefer_Primary | None.'
                type: string
            type: object
          status:
            properties:
              phase:
                default: Pending
                type: string
              observedGeneration:
                format: int64
                type: integer
              edition:
                type: string
              clusterType:
                default: None
                type: string
              primaryReplica:
                type: string
              primaryUnreachableCount:
                description: Consecutive health passes where no primary answered. Reset on the first healthy pass; failover actions trigger only at the spec threshold.
                format: int32
                type: integer
              primaryUnreachableSince:
                description: When the primary was first observed unreachable. A pass counter is not a delay — every increment writes the status, which re-enqueues the AG immediately, so three "passes" could elapse in seconds. Failover requires BOTH the pass count and this wall-clock window. Reset on the first pass that finds a primary.
                format: date-time
                type: string
              primaryProductVersion:
                description: 'Engine build of the last confirmed primary, e.g. "16.0.4125.3". A replica running an older major version is never promoted: it cannot redo the newer log.'
                type: string
              pendingFailover:
                description: An annotation-requested failover that has not landed yet. The planned path keeps its annotation until the failover completes, so a transient error retries instead of silently discarding the request.
                properties:
                  target:
                    type: string
                  requestedAt:
                    format: date-time
                    type: string
                  attempts:
                    format: int32
                    type: integer
                type: object
              reconcilePaused:
                description: 'True while reconciliation is paused by the operator annotation: health checks, failover and rolling updates are NOT running.'
                type: boolean
              primaryEndpoint:
                type: string
              readOnlyEndpoint:
                type: string
              memory:
                properties:
                  podLimitMb:
                    description: Pod resources.limits.memory in MB.
                    format: int32
                    type: integer
                  sqlMaxMemoryMb:
                    description: sp_configure 'max server memory' value applied in MB.
                    format: int32
                    type: integer
                  sqlMinMemoryMb:
                    description: sp_configure 'min server memory' value applied in MB (0 if not set).
                    format: int32
                    type: integer
