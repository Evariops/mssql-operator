apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqlavailabilitygroups.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlAvailabilityGroup
    listKind: SqlAvailabilityGroupList
    plural: sqlavailabilitygroups
    singular: sqlavailabilitygroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.primaryReplica
      name: Primary
      priority: 1
      type: string
    - jsonPath: .status.cumulativeUpdate
      name: CU
      priority: 1
      type: string
    - jsonPath: .status.primaryProductVersion
      name: Build
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              automation:
                description: 'What the operator may do on its own for this resource (Observe, Plan, Apply), and the destructive actions pre-authorized within its budget.'
                properties:
                  mode:
                    default: Apply
                    description: Observe (decide and report, act on nothing), Plan (also expose the plan) or Apply (act).
                    enum:
                    - Observe
                    - Plan
                    - Apply
                    type: string
                  preAuthorized:
                    description: Destructive action types the operator may run without an approval, within its budget (one per resource an hour).
                    items:
                      type: string
                    type: array
                type: object
              edition:
                default: Enterprise
                description: Standard | Enterprise — determines constraints and available features.
                type: string
              replicas:
                description: Replica topology (count, sync mode, overrides).
                properties:
                  count:
                    default: 3
                    description: 'Total number of replicas. Standard: must be 2. Enterprise: 2-9.'
                    format: int32
                    type: integer
                  synchronousCount:
                    default: 2
                    description: Number of replicas in SYNCHRONOUS_COMMIT mode (including primary).
                    format: int32
                    type: integer
                  requiredSynchronizedSecondariesToCommit:
                    default: 1
                    description: Number of synchronized secondaries required before commit returns. 0 = read-scale, 1+ = data protection. Ignored on Standard, which does not support the setting.
                    format: int32
                    type: integer
                  durability:
                    description: 'The durability contract, fixed in the control record when the AG is created. Quorum: REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT never goes below 1 and every commit is hardened on a secondary before it is acknowledged — writes BLOCK when no secondary is synchronized, and no acknowledged commit is ever lost by an automatic failover; with a single synchronous secondary (synchronousCount 2), writes block whenever it is down. Not available on Standard, whose basic availability groups do not support the setting. Legacy: the setting may go down to 0 to keep writes flowing; an unplanned failover can then lose up to SESSION_TIMEOUT + T_step + J of writes, and is automatic only with allowAutomaticDataLossFailover. Absent: Quorum for a new Enterprise AG with synchronousCount of at least 3, Legacy otherwise (condition DurabilityAtRisk).'
                    enum:
                    - Quorum
                    - Legacy
                    type: string
                  requiredSyncFloor:
                    description: 'Durability floor: the operator will never lower REQUIRED_SYNCHRONIZED_SECONDARIES_TO_COMMIT below this value to keep the group write-available. The operator lowers that setting when a synchronous secondary drops, so commits do not freeze — a trade of durability for availability. The README documented a "floor" to opt out of that trade; no such setting existed, and the lowering was unconditional, down to 0 (commits acknowledged by the primary alone). Deployments that must never weaken durability set this to 1: writes then block, loudly, instead of silently becoming non-durable. Refused on Standard, which does not support the setting.'
                    format: int32
                    type: integer
                  overrides:
                    description: Per-replica overrides (by ordinal index).
                    items:
                      properties:
                        ordinal:
                          description: Pod ordinal index (0-based).
                          format: int32
                          type: integer
                        availabilityMode:
                          description: SynchronousCommit | AsynchronousCommit.
                          type: string
                        readableSecondary:
                          description: 'Enterprise only: No | ReadOnly | All.'
                          type: string
                        backupPriority:
                          description: 'Enterprise only: backup priority 0-100.'
                          format: int32
                          type: integer
                        sessionTimeout:
                          description: Session timeout in seconds.
                          format: int32
                          type: integer
                      type: object
                    type: array
                type: object
                x-kubernetes-validations:
                - message: 'spec.replicas.count is immutable: AG scale-out/in is not orchestrated. Recreate the AG to change the replica count.'
                  rule: has(self.count) == has(oldSelf.count) && (!has(self.count) || self.count == oldSelf.count)
              replicaDefaults:
                description: Default settings applied to all replicas unless overridden.
                properties:
                  availabilityMode:
                    default: SynchronousCommit
                    type: string
                  readableSecondary:
                    default: All
                    type: string
                  seedingMode:
                    default: Automatic
                    type: string
                  backupPriority:
                    default: 50
                    format: int32
                    type: integer
                  sessionTimeout:
                    default: 10
                    format: int32
                    type: integer
                type: object
              instanceTemplate:
                description: SQL Server instance template (image, resources, storage).
                properties:
                  version:
                    default: "2022"
                    type: string
                  cumulativeUpdate:
                    description: 'The exact cumulative update every replica runs — RTM, CU25, or CU32-GDR1. One build for the whole AG is the point: replicas on different builds is precisely the state an AG cannot sustain, so this is what a rolling CU upgrade moves. Mutually exclusive with imageTag; a CU downgrade is rejected at admission.'
                    pattern: ^(RTM|CU[0-9]+)(-GDR[0-9]*)?$
                    type: string
                  baseOs:
                    description: The OS base every replica's image is built on — ubuntu-22.04, ubuntu-24.04. Restricted to the bases the declared version actually ships under. Omit it to follow the operator's default. Mutually exclusive with imageTag.
                    pattern: ^ubuntu-[0-9]{2}\.[0-9]{2}$
                    type: string
                  image:
                    type: string
                  imageTag:
                    type: string
                  memory:
                    properties:
                      total:
                        description: Total memory allocated to the pod (e.g. "16Gi"). Sets both requests and limits for Guaranteed QoS.
                        type: string
                      systemReserve:
                        default: 2Gi
                        description: Memory reserved for OS, SQL Agent, sidecars. Default "2Gi". SQL max memory = Total - SystemReserve.
                        type: string
                      minMemory:
                        description: "Optional: sp_configure 'min server memory' (e.g. \"8Gi\"). If omitted, SQL Server uses its default (0)."
                        type: string
                    type: object
                  resources:
                    properties:
                      requests:
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                          ephemeralStorage:
                            description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                            type: string
                        type: object
                      limits:
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                          ephemeralStorage:
                            description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                            type: string
                        type: object
                      cpuPinning:
                        type: boolean
                    type: object
                  storage:
                    properties:
                      data:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                      sysDb:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                      log:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                      tempDb:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                      backup:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                      errorLogs:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                      certBackups:
                        properties:
                          size:
                            default: 10Gi
                            type: string
                          storageClassName:
                            type: string
                          accessModes:
                            items:
                              type: string
                            type: array
                        type: object
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                    type: object
                    x-kubernetes-validations:
                    - message: an optional volume cannot be added to or removed from an existing resource
                      rule: has(self.sysDb) == has(oldSelf.sysDb)
                    - message: an optional volume cannot be added to or removed from an existing resource
                      rule: has(self.tempDb) == has(oldSelf.tempDb)
                    - message: an optional volume cannot be added to or removed from an existing resource
                      rule: has(self.errorLogs) == has(oldSelf.errorLogs)
                    - message: an optional volume cannot be added to or removed from an existing resource
                      rule: has(self.certBackups) == has(oldSelf.certBackups)
                  configurationRef:
                    properties:
                      name:
                        type: string
                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  tolerations:
                    items:
                      properties:
                        effect:
                          type: string
                        key:
                          type: string
                        operator:
                          type: string
                        tolerationSeconds:
                          format: int64
                          type: integer
                        value:
                          type: string
                      type: object
                    type: array
                  priorityClassName:
                    type: string
                  runtimeClassName:
                    type: string
                  podAnnotations:
                    additionalProperties:
                      type: string
                    description: 'Annotations added to every replica''s pod — for what a node agent reads from the pod, such as cpu.preserve.resource-policy.nri.io: "true", which keeps an NRI resource policy from resizing SQL Server''s cpuset under it. Keys of the operator''s domain are refused.'
                    type: object
                  shutdown:
                    description: 'Pod shutdown behaviour: grace period for clean checkpointing.'
                    properties:
                      gracePeriodSeconds:
                        default: 180
                        description: terminationGracePeriodSeconds — SQL Server needs time to checkpoint; the k8s default of 30s SIGKILLs sqlservr mid-checkpoint and forces a long crash-recovery.
                        format: int64
                        type: integer
                      primaryHandoffSeconds:
                        default: 30
                        description: 'Availability groups only: how long the preStop hook of the primary waits for the planned failover the operator starts when the pod stops (deletion, node shutdown), while a synchronous secondary is synchronized. 0 never waits. Kept 45 s under the grace period. The operator only arms the wait when it will fail over (NodeMaintenance in Enforce).'
                        format: int32
                        type: integer
                    type: object
                  probes:
                    description: Probe budgets.
                    properties:
                      readinessFailureThreshold:
                        default: 6
                        description: Consecutive readiness failures before the pod leaves the Service. Default 6 (≈1 min).
                        format: int32
                        maximum: 60.0
                        minimum: 1.0
                        type: integer
                      readinessTimeoutSeconds:
                        default: 10
                        description: Readiness probe timeout, also used as the sqlcmd login timeout (-l). Default 10s.
                        format: int32
                        maximum: 60.0
                        minimum: 1.0
                        type: integer
                      startupFailureThreshold:
                        default: 90
                        description: Startup probe failures (10s period) before the container is restarted. Default 90 (15 min), which is the budget for the master upgrade scripts of a cumulative update.
                        format: int32
                        maximum: 720.0
                        minimum: 1.0
                        type: integer
                      livenessFailureThreshold:
                        default: 5
                        description: Liveness failures (30s period) before the container is restarted. Default 5.
                        format: int32
                        maximum: 60.0
                        minimum: 1.0
                        type: integer
                      requireDatabasesRecovered:
                        default: true
                        description: "Whether readiness requires every user database to be out of crash recovery. Default true: SELECT 1 on master answers minutes before the databases are usable, so the pod used to re-enter the Service while the application got errors 922/945 on every query. This setting is the escape hatch. The check is all-or-nothing: ONE database stuck in RECOVERY_PENDING for good (a lost file, a missing filegroup) keeps the pod NotReady forever, which removes it from the headless Service, makes it unreachable to the operator's own health probes, and hands a single broken database the power to look like a dead replica. Set this to false to serve the other fifty databases while the broken one is repaired."
                        type: boolean
                    type: object
                  podSecurityContext:
                    properties:
                      appArmorProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      fsGroup:
                        format: int64
                        type: integer
                      fsGroupChangePolicy:
                        type: string
                      runAsGroup:
                        format: int64
                        type: integer
                      runAsNonRoot:
                        type: boolean
                      runAsUser:
                        format: int64
                        type: integer
                      seLinuxChangePolicy:
                        type: string
                      seLinuxOptions:
                        properties:
                          level:
                            type: string
                          role:
                            type: string
                          type:
                            type: string
                          user:
                            type: string
                        type: object
                      seccompProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      supplementalGroups:
                        items:
                          format: int64
                          type: integer
                        type: array
                      supplementalGroupsPolicy:
                        type: string
                      sysctls:
                        items:
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                          type: object
                        type: array
                      windowsOptions:
                        properties:
                          gmsaCredentialSpec:
                            type: string
                          gmsaCredentialSpecName:
                            type: string
                          hostProcess:
                            type: boolean
                          runAsUserName:
                            type: string
                        type: object
                    type: object
                  securityContext:
                    properties:
                      allowPrivilegeEscalation:
                        type: boolean
                      appArmorProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      capabilities:
                        properties:
                          add:
                            items:
                              type: string
                            type: array
                          drop:
                            items:
                              type: string
                            type: array
                        type: object
                      privileged:
                        type: boolean
                      procMount:
                        type: string
                      readOnlyRootFilesystem:
                        type: boolean
                      runAsGroup:
                        format: int64
                        type: integer
                      runAsNonRoot:
                        type: boolean
                      runAsUser:
                        format: int64
                        type: integer
                      seLinuxOptions:
                        properties:
                          level:
                            type: string
                          role:
                            type: string
                          type:
                            type: string
                          user:
                            type: string
                        type: object
                      seccompProfile:
                        properties:
                          localhostProfile:
                            type: string
                          type:
                            type: string
                        type: object
                      windowsOptions:
                        properties:
                          gmsaCredentialSpec:
                            type: string
                          gmsaCredentialSpecName:
                            type: string
                          hostProcess:
                            type: boolean
                          runAsUserName:
                            type: string
                        type: object
                    type: object
                  tls:
                    description: The certificate every replica presents; one Secret for all replicas, its SANs covering *.<ag>-headless.<namespace>.svc.cluster.local.
                    properties:
                      secretName:
                        description: "A kubernetes.io/tls Secret (tls.crt, tls.key) in the resource's namespace. Its SANs must cover the names clients connect to: <instance>.<namespace>.svc.cluster.local for an instance; *.<ag>-headless.<namespace>.svc.cluster.local and the listener Services for an availability group. SQL Server reads it at startup: a renewal takes effect at the next restart."
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      forceEncryption:
                        description: Refuse unencrypted client connections (mssql.conf network.forceencryption).
                        type: boolean
                    type: object
                type: object
              hadrCertificate:
                description: HADR certificate for endpoint authentication (X.509).
                properties:
                  source:
                    default: Generate
                    description: Generate | Import.
                    type: string
                  model:
                    default: PerReplica
                    description: PerReplica (each replica gets its own cert, public keys cross-imported).
                    type: string
                  generate:
                    properties:
                      subject:
                        type: string
                      expiryDate:
                        type: string
                      keyLength:
                        default: 2048
                        format: int32
                        type: integer
                    type: object
                  importFrom:
                    properties:
                      secretName:
                        type: string
                      certificateKey:
                        default: certificate.cer
                        type: string
                      privateKeyKey:
                        default: private-key.pvk
                        type: string
                      passwordKey:
                        type: string
                    type: object
                  secretName:
                    description: K8s Secret where the operator stores/reads the certificate.
                    type: string
                  encryptionPasswordSecretRef:
                    description: Password used to encrypt the private key during export.
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                    type: object
                type: object
              endpoint:
                description: Database mirroring endpoint configuration.
                properties:
                  name:
                    default: Hadr_endpoint
                    type: string
                  port:
                    default: 5022
                    format: int32
                    maximum: 65535.0
                    minimum: 1024.0
                    type: integer
                  encryptionAlgorithm:
                    default: AES
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'endpoint.name is immutable in v1alpha1: recreating the mirroring endpoint interrupts replication'
                  rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name == oldSelf.name)
                - message: 'endpoint.port is immutable in v1alpha1: recreating the mirroring endpoint interrupts replication'
                  rule: has(self.port) == has(oldSelf.port) && (!has(self.port) || self.port == oldSelf.port)
              masterKeyPasswordSecretRef:
                description: Secret containing the Database Master Key password.
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              saPasswordSecretRef:
                description: Secret containing the SA password for all replicas.
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              machineKeySecretRef:
                description: Secret containing the machine key for all replicas (migration scenario).
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              smkBackupPasswordSecretRef:
                description: Secret containing the SMK backup encryption password.
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              operatorLoginSecretRef:
                description: Optional dedicated SQL login for operator (instead of SA).
                properties:
                  name:
                    description: Secret name containing login and password keys.
                    type: string
                  loginKey:
                    default: login
                    description: Key in the Secret holding the SQL login name.
                    type: string
                  passwordKey:
                    default: password
                    description: Key in the Secret holding the SQL password.
                    type: string
                type: object
              listener:
                description: Read/Write listener service.
                properties:
                  port:
                    default: 1433
                    format: int32
                    type: integer
                  service:
                    properties:
                      type:
                        default: ClusterIP
                        pattern: ^(ClusterIP|NodePort|LoadBalancer)$
                        type: string
                      port:
                        default: 1433
                        format: int32
                        maximum: 65535.0
                        minimum: 1024.0
                        type: integer
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                type: object
              readOnlyListener:
                description: Read-Only listener service (Enterprise only, ignored for Standard).
                properties:
                  port:
                    default: 1433
                    format: int32
                    type: integer
                  service:
                    properties:
                      type:
                        default: ClusterIP
                        pattern: ^(ClusterIP|NodePort|LoadBalancer)$
                        type: string
                      port:
                        default: 1433
                        format: int32
                        maximum: 65535.0
                        minimum: 1024.0
                        type: integer
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  fallbackToPrimary:
                    default: true
                    description: When no secondary can serve reads (all disconnected, not synchronized or not readable), the primary serves them through this listener, and ends the read-only routing list.
                    type: boolean
                type: object
              readOnlyRouting:
                description: Read-Only routing configuration (Enterprise only).
                properties:
                  enabled:
                    type: boolean
                type: object
              failover:
                description: Failover behavior and split-brain protection.
                properties:
                  operatorManaged:
                    default: true
                    description: Whether the operator manages failovers (always MANUAL at SQL Server level).
                    type: boolean
                  healthCheckIntervalSeconds:
                    default: 10
                    format: int32
                    type: integer
                  healthCheckTimeoutSeconds:
                    default: 15
                    description: Deadline of one health pass over every replica, in seconds (at least 5). A replica that has not answered by then counts as unreachable for that pass.
                    format: int32
                    type: integer
                  failoverConditionLevel:
                    default: 2
                    description: Severity level triggering operator failover, on the SQL Server scale (1=ServerDown, 2=+Unresponsive, 3=+CriticalErrors, 4=+ModerateErrors, 5=+AnyFailure). Only level 2 is implemented; admission refuses the others.
                    format: int32
                    type: integer
                  primaryUnreachableThreshold:
                    default: 3
                    description: 'Consecutive health passes without a reachable primary before the operator acts (drains the writer label, promotes a secondary). One missed pass is a monitoring blip, not an outage.'
                    format: int32
                    type: integer
                  splitBrainProtection:
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      fencingStrategy:
                        default: NetworkIsolation
                        description: NetworkIsolation | ManualApproval | External.
                        type: string
                      fencingTimeoutSeconds:
                        default: 60
                        format: int32
                        type: integer
                    type: object
                  preferredTargets:
                    description: Preferred failover targets by ordinal.
                    items:
                      properties:
                        ordinal:
                          format: int32
                          type: integer
                      type: object
                    type: array
                  allowAutomaticDataLossFailover:
                    description: Allow operator to automatically perform force-failover-allow-data-loss.
                    type: boolean
                  maxDataLossKb:
                    description: Upper bound (KB of unsent/un-redone log) on the data loss an AUTOMATIC forced failover may accept. When the freshest eligible replica is further behind than this — or when the lag cannot be measured — the operator stops and asks for a human decision instead of silently discarding an unbounded amount of committed transactions. Unset = no bound (previous behaviour). Ignored on manual force-failover-to, which is an explicit decision.
                    format: int64
                    type: integer
                  removeDisconnectedReplicaAfterMinutes:
                    default: 30
                    description: A replica the primary has seen DISCONNECTED for this long, while it holds back the log of an AG database that is at least 85% full, is taken out of the AG so that the log can be truncated; it is added back and re-seeded when it answers again. Requires automatic seeding. 0 never removes a replica.
                    format: int32
                    maximum: 1440
                    minimum: 0
                    type: integer
                  autoResumeDataMovement:
                    default: true
                    description: After failover, automatically resume suspended databases.
                    type: boolean
                  autoReconfigurePrimary:
                    default: true
                    description: After failover, automatically update pod labels.
                    type: boolean
                type: object
              updateStrategy:
                description: Rolling update strategy (AG-aware).
                properties:
                  type:
                    default: RollingUpdate
                    pattern: ^(RollingUpdate|OnDelete)$
                    type: string
                  rollingUpdate:
                    properties:
                      maxUnavailable:
                        default: 1
                        format: int32
                        maximum: 9.0
                        minimum: 1.0
                        type: integer
                      preUpdateBackup:
                        description: 'Not implemented: no backup is taken before a replica restarts. Admission refuses true.'
                        type: boolean
                      healthCheckTimeoutSeconds:
                        default: 300
                        format: int32
                        type: integer
                      pauseBetweenPodsSeconds:
                        default: 60
                        format: int32
                        type: integer
                      updateSecondariesFirst:
                        default: true
                        type: boolean
                      failoverBeforePrimaryUpdate:
                        default: true
                        type: boolean
                    type: object
                type: object
              antiAffinity:
