apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqltdecertificates.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlTdeCertificate
    listKind: SqlTdeCertificateList
    plural: sqltdecertificates
    singular: sqltdecertificate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.encryptedDatabases
      name: Encrypted
      type: integer
    - jsonPath: .status.pendingDatabases
      name: Pending
      type: integer
    - jsonPath: .status.rotationPhase
      name: Rotation
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              automation:
                description: 'What the operator may do on its own for this resource (Observe, Plan, Apply), and the destructive actions pre-authorized within its budget.'
                properties:
                  mode:
                    default: Apply
                    description: Observe (decide and report, act on nothing), Plan (also expose the plan) or Apply (act).
                    enum:
                    - Observe
                    - Plan
                    - Apply
                    type: string
                  preAuthorized:
                    description: Destructive action types the operator may run without an approval, within its budget (one per resource an hour).
                    items:
                      type: string
                    type: array
                type: object
              target:
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    type: object
                  instances:
                    items:
                      type: string
                    type: array
                  availabilityGroups:
                    items:
                      type: string
                    type: array
                type: object
              certificate:
                properties:
                  logicalName:
                    type: string
                  source:
                    properties:
                      type:
                        default: OperatorManaged
                        type: string
                      operatorManaged:
                        properties:
                          subjectTemplate:
                            default: TDE certificate {logicalName}
                            type: string
                          expiryDate:
                            type: string
                          keyLength:
                            default: 2048
                            format: int32
                            type: integer
                          sqlCertificateNameTemplate:
                            default: '{logicalName}_{version}'
                            type: string
                          sourceSecretNameTemplate:
                            default: '{logicalName}-{version}'
                            type: string
                          sourceSecretEncryptionPasswordRef:
                            properties:
                              name:
                                type: string
                              key:
                                type: string
                            type: object
                        type: object
                      kubernetesSecret:
                        properties:
                          discovery:
                            properties:
                              namespace:
                                type: string
                              names:
                                items:
                                  properties:
                                    secretName:
                                      type: string
                                    version:
                                      type: string
                                    sqlCertificateName:
                                      type: string
                                    certificateKey:
                                      default: certificate.cer
                                      type: string
                                    privateKeyKey:
                                      default: private-key.pvk
                                      type: string
                                    passwordKey:
                                      default: password
                                      type: string
                                  type: object
                                type: array
                              matchLabels:
                                additionalProperties:
                                  type: string
                                type: object
                            type: object
                          activationPolicy:
                            default: SecretRole
                            type: string
                        type: object
                    type: object
                  archiveToSecret:
                    properties:
                      secretNameTemplate:
                        default: '{logicalName}-{thumbprintShort}-{timestamp}'
                        type: string
                      encryptionPasswordSecretRef:
                        properties:
                          name:
                            type: string
                          key:
                            type: string
                        type: object
                      immutable:
                        default: true
                        type: boolean
                    type: object
                  backupToS3:
                    properties:
                      connection:
                        properties:
                          endpoint:
                            type: string
                          bucket:
                            type: string
                          region:
                            default: us-east-1
                            type: string
                          clusterName:
                            type: string
                          credentialsSecretRef:
                            properties:
                              name:
                                type: string
                              key:
                                type: string
                            type: object
                          forcePathStyle:
                            type: boolean
                        type: object
                      objectKeyTemplate:
                        default: '{clusterName}/tde/{logicalName}/{version}/{thumbprintShort}.enc'
                        type: string
                      encryption:
                        properties:
                          type:
                            default: AesKey
                            type: string
                          aesKey:
                            properties:
                              keySecretRef:
                                properties:
                                  name:
                                    type: string
                                  key:
                                    type: string
                                type: object
                            type: object
                          envelopeEncryption:
                            properties:
                              publicKeySecretRef:
                                properties:
                                  name:
                                    type: string
                                  key:
                                    type: string
                                type: object
                              privateKeySecretRef:
                                properties:
                                  name:
                                    type: string
                                  key:
                                    type: string
                                type: object
                            type: object
                        type: object
                    type: object
                type: object
                x-kubernetes-validations:
                - message: 'certificate.logicalName is immutable: it is the identity of the version/secret chain'
                  rule: has(self.logicalName) == has(oldSelf.logicalName) && (!has(self.logicalName) || self.logicalName == oldSelf.logicalName)
              databases:
                properties:
                  selector:
                    properties:
                      allUserDatabases:
                        type: boolean
                      names:
                        items:
                          type: string
                        type: array
                      namePatterns:
                        items:
                          type: string
                        type: array
                      excludeNames:
                        items:
                          type: string
                        type: array
                      excludePatterns:
                        items:
                          type: string
                        type: array
                      excludeSystemDatabases:
                        default: true
                        type: boolean
                      missingDatabasePolicy:
                        default: Warn
                        type: string
                    type: object
                  policy:
                    properties:
                      encryptionAlgorithm:
                        default: AES_256
                        type: string
                      nonEncryptedDatabasePolicy:
                        default: Encrypt
                        type: string
                    type: object
                type: object
              rotation:
                properties:
                  intervalDays:
                    default: 365
                    format: int32
                    type: integer
                  alertAfterCertificateAgeDays:
                    default: 730
                    format: int32
                    type: integer
                  mode:
                    default: ProtectorOnly
                    type: string
                  trigger:
                    default: ManualOnly
                    type: string
                  maxParallelTargets:
                    default: 1
                    format: int32
                    type: integer
                  dekRegeneration:
                    properties:
                      maxParallelDatabasesPerTarget:
                        default: 1
                        format: int32
                        type: integer
                      perDatabaseTimeoutMinutes:
                        default: 120
                        format: int32
                        type: integer
                    type: object
                  retirement:
                    properties:
                      notBeforeDays:
                        default: 90
                        format: int32
                        type: integer
                      approvalMode:
                        default: Manual
                        type: string
                      requireFreshFullBackupAfterRotation:
                        default: true
                        type: boolean
                      requireLogBackupAfterDekRegeneration:
                        default: true
                        type: boolean
                    type: object
                type: object
            type: object
          status:
            properties:
              phase:
                default: Pending
                type: string
              observedGeneration:
                format: int64
                type: integer
              targets:
                description: Targets (instances/AGs) matched by the selector.
                format: int32
                type: integer
              activeVersion:
                description: Active certificate version + thumbprint currently protecting databases.
                type: string
              activeThumbprint:
                type: string
              candidateThumbprint:
                description: Candidate (in-rotation) certificate thumbprint, when a rotation is in flight.
                type: string
              rotationPhase:
                default: Idle
                description: 'Coarse rotation phase: Idle | Preparing | Rotating | RetentionWaiting | Failed.'
                type: string
              lastRotationTime:
                format: date-time
                type: string
              retireNotBefore:
                format: date-time
                type: string
              retirementPendingApproval:
                type: boolean
              encryptedDatabases:
                description: Roll-up of database encryption across all targets.
                format: int32
                type: integer
              pendingDatabases:
                format: int32
                type: integer
              failedDatabases:
                format: int32
                type: integer
              pendingDekRegenerations:
                description: 'DEK regenerations still owed after a protector move ({kind}/{target}/{database}): deferred by maxParallelDatabasesPerTarget or waiting for a log backup. Empty in the steady state.'
                items:
                  type: string
                type: array
              conditions:
                items:
                  properties:
                    type:
                      maxLength: 316
                      type: string
                    status:
                      default: "False"
                      description: True | False | Unknown (metav1.ConditionStatus).
                      type: string
                    reason:
                      default: Unknown
                      description: PascalCase machine-readable reason (required by metav1.Condition).
                      maxLength: 1024
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The .metadata.generation the condition was computed against (metav1.Condition).
                      format: int64
                      type: integer
                    lastTransitionTime:
                      format: date-time
                      type: string
                  required:
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}