apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqlstoredprocedures.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlStoredProcedure
    listKind: SqlStoredProcedureList
    plural: sqlstoredprocedures
    singular: sqlstoredprocedure
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.deployedProcedures
      name: Deployed
      type: integer
    - jsonPath: .status.desiredProcedures
      name: Desired
      type: integer
    - jsonPath: .status.targets
      name: Targets
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              target:
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    type: object
                  instances:
                    items:
                      type: string
                    type: array
                  availabilityGroups:
                    items:
                      type: string
                    type: array
                type: object
              databases:
                items:
                  type: string
                type: array
              databaseFilter:
                properties:
                  pattern:
                    type: string
                  exclude:
                    items:
                      type: string
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              inline:
                items:
                  properties:
                    name:
                      type: string
                    schema:
                      default: dbo
                      type: string
                    definition:
                      type: string
                  type: object
                type: array
              gitHub:
                properties:
                  repository:
                    type: string
                  authSecretRef:
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                    type: object
                  ref:
                    properties:
                      tag:
                        type: string
                      sha:
                        type: string
                    type: object
                  paths:
                    items:
                      properties:
                        path:
                          type: string
                        schema:
                          default: dbo
                          type: string
                      type: object
                    type: array
                  include:
                    items:
                      type: string
                    type: array
                  exclude:
                    items:
                      type: string
                    type: array
                type: object
              deploymentOptions:
                properties:
                  strategy:
                    default: CreateOrAlter
                    type: string
                  transactional:
                    default: true
                    type: boolean
                  executionOrder:
                    default: Alphabetical
                    type: string
                  validateSyntax:
                    default: true
                    type: boolean
                  dryRun:
                    type: boolean
                  deployAs:
                    default: LeastPrivilege
                    description: 'Identity used to deploy: LeastPrivilege (default) deploys via a dedicated db_ddladmin login scoped to the targeted databases; Sa deploys as sa (legacy). LeastPrivilege bounds the blast radius of a compromised procedure.'
                    pattern: LeastPrivilege|Sa
                    type: string
                type: object
              sync:
                properties:
                  intervalMinutes:
                    default: 30
                    format: int32
                    type: integer
                  followLatestRelease:
                    type: boolean
                  releaseFilter:
                    type: string
                type: object
            type: object
          status:
            properties:
              phase:
                default: Pending
                type: string
              observedGeneration:
                format: int64
                type: integer
              source:
                type: string
              sourceRef:
                type: string
              targets:
                description: Number of targets (instances/AGs) matched by the selector.
                format: int32
                type: integer
              failedTargets:
                description: Targets that could not be reconciled this pass.
                format: int32
                type: integer
              desiredProcedures:
                description: Procedures defined in the spec (inline + fetched).
                format: int32
                type: integer
              deployedProcedures:
                description: Procedure deployments actually applied across all targets and databases.
                format: int32
                type: integer
              lastDeployedRevision:
                description: The source revision (GitHub tag/sha or inline) last deployed.
                type: string
              resolvedCommitSha:
                description: 'Commit SHA the GitHub source is currently pinned at: tags and followLatestRelease are resolved to a commit at reconcile time for traceability; an event is emitted whenever this changes.'
                type: string
              conditions:
                items:
                  properties:
                    type:
                      maxLength: 316
                      type: string
                    status:
                      default: "False"
                      description: True | False | Unknown (metav1.ConditionStatus).
                      type: string
                    reason:
                      default: Unknown
                      description: PascalCase machine-readable reason (required by metav1.Condition).
                      maxLength: 1024
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The .metadata.generation the condition was computed against (metav1.Condition).
                      format: int64
                      type: integer
                    lastTransitionTime:
                      format: date-time
                      type: string
                  required:
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}