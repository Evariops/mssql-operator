apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqlusers.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlUser
    listKind: SqlUserList
    plural: sqlusers
    singular: sqluser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyTargets
      name: Ready
      type: integer
    - jsonPath: .status.totalTargets
      name: Targets
      type: integer
    - jsonPath: .status.expired
      name: Expired
      priority: 1
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              target:
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    type: object
                  instances:
                    items:
                      type: string
                    type: array
                  availabilityGroups:
                    items:
                      type: string
                    type: array
                type: object
              login:
                properties:
                  name:
                    description: 'SQL login name. Restrictive charset.'
                    maxLength: 128
                    pattern: ^[\p{L}_][\p{L}\p{N}_\-]*$
                    type: string
                  type:
                    default: SqlLogin
                    type: string
                  passwordSecretRef:
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                    type: object
                  defaultDatabase:
                    type: string
                  checkPolicy:
                    default: true
                    type: boolean
                  checkExpiration:
                    type: boolean
                type: object
              expiration:
                properties:
                  expiresAt:
                    type: string
                  ttl:
                    type: string
                  action:
                    default: Disable
                    type: string
                  terminateSessions:
                    default: true
                    type: boolean
                type: object
              databasePermissions:
                items:
                  properties:
                    databases:
                      items:
                        type: string
                      type: array
                    databaseFilter:
                      properties:
                        pattern:
                          type: string
                        exclude:
                          items:
                            type: string
                          type: array
                        matchLabels:
                          additionalProperties:
                            type: string
                          type: object
                      type: object
                    roles:
                      items:
                        type: string
                      type: array
                    schemaPermissions:
                      items:
                        properties:
                          schema:
                            default: dbo
                            type: string
                          permissions:
                            items:
                              type: string
                            type: array
                        type: object
                      type: array
                  type: object
                type: array
              serverRoles:
                items:
                  type: string
                type: array
              serverPermissions:
                items:
                  type: string
                type: array
              overrides:
                items:
                  properties:
                    instance:
                      type: string
                    availabilityGroup:
                      type: string
                    databasePermissions:
                      items:
                        properties:
                          databases:
                            items:
                              type: string
                            type: array
                          databaseFilter:
                            properties:
                              pattern:
                                type: string
                              exclude:
                                items:
                                  type: string
                                type: array
                              matchLabels:
                                additionalProperties:
                                  type: string
                                type: object
                            type: object
                          roles:
                            items:
                              type: string
                            type: array
                          schemaPermissions:
                            items:
                              properties:
                                schema:
                                  default: dbo
                                  type: string
                                permissions:
                                  items:
                                    type: string
                                  type: array
                              type: object
                            type: array
                        type: object
                      type: array
                    serverRoles:
                      items:
                        type: string
                      type: array
                    serverPermissions:
                      items:
                        type: string
                      type: array
                  type: object
                type: array
            type: object
          status:
            properties:
              appliedLoginName:
                description: 'The login name last applied in SQL: when the spec name differs, the controller renames the login (SID preserved) instead of orphaning the old one.'
                type: string
              phase:
                default: Pending
                type: string
              observedGeneration:
                format: int64
                type: integer
              effectiveExpiresAt:
                type: string
              expired:
                type: boolean
              revokedAt:
                format: date-time
                type: string
              totalTargets:
                description: Targets (instances/AGs) matched by the selector.
                format: int32
                type: integer
              readyTargets:
                description: Targets fully provisioned this pass.
                format: int32
                type: integer
              failedTargets:
                description: Targets that failed provisioning this pass.
                format: int32
                type: integer
              appliedGrants:
                description: 'Grants this resource made, per target ({kind}/{target}|{grant}|{value}): the ones the spec no longer asks for are revoked. A grant made outside the operator is never listed, so it is never revoked.'
                items:
                  type: string
                type: array
              conditions:
                items:
                  properties:
                    type:
                      maxLength: 316
                      type: string
                    status:
                      default: "False"
                      description: True | False | Unknown (metav1.ConditionStatus).
                      type: string
                    reason:
                      default: Unknown
                      description: PascalCase machine-readable reason (required by metav1.Condition).
                      maxLength: 1024
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The .metadata.generation the condition was computed against (metav1.Condition).
                      format: int64
                      type: integer
                    lastTransitionTime:
                      format: date-time
                      type: string
                  required:
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}