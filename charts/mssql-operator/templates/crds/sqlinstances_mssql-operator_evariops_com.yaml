apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqlinstances.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlInstance
    listKind: SqlInstanceList
    plural: sqlinstances
    singular: sqlinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.version
      name: Version
      priority: 1
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              mode:
                default: SingleNode
                type: string
                x-kubernetes-validations:
                - message: 'spec.mode is immutable: converting between SingleNode and AvailabilityGroupMember is not an in-place operation'
                  rule: self == oldSelf
              version:
                default: "2022"
                type: string
              edition:
                default: Developer
                type: string
              image:
                type: string
              imageTag:
                type: string
              memory:
                properties:
                  total:
                    description: Total memory allocated to the pod (e.g. "16Gi"). Sets both requests and limits for Guaranteed QoS.
                    type: string
                  systemReserve:
                    default: 2Gi
                    description: Memory reserved for OS, SQL Agent, sidecars. Default "2Gi". SQL max memory = Total - SystemReserve.
                    type: string
                  minMemory:
                    description: "Optional: sp_configure 'min server memory' (e.g. \"8Gi\"). If omitted, SQL Server uses its default (0)."
                    type: string
                type: object
              resources:
                properties:
                  requests:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                      ephemeralStorage:
                        description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                        type: string
                    type: object
                  limits:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                      ephemeralStorage:
                        description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                        type: string
                    type: object
                  cpuPinning:
                    type: boolean
                type: object
              storage:
                properties:
                  data:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: self == oldSelf
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                  sysDb:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: self == oldSelf
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                  log:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: self == oldSelf
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                  tempDb:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: self == oldSelf
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                  backup:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: self == oldSelf
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                  errorLogs:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: self == oldSelf
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                  certBackups:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                        x-kubernetes-validations:
                        - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                          rule: self == oldSelf
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                type: object
              service:
                properties:
                  type:
                    default: ClusterIP
                    pattern: ClusterIP|NodePort|LoadBalancer|ExternalName
                    type: string
                  port:
                    default: 1433
                    format: int32
                    maximum: 65535.0
                    minimum: 1024.0
                    type: integer
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              saPasswordSecretRef:
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              antiAffinity:
                properties:
                  requiredAntiAffinityWith:
                    items:
                      properties:
                        instanceName:
                          type: string
                        topologyKey:
                          default: kubernetes.io/hostname
                          type: string
                      type: object
                    type: array
                  preferredAntiAffinityWith:
                    items:
                      properties:
                        weight:
                          default: 100
                          format: int32
                          type: integer
                        instanceName:
                          type: string
                        topologyKey:
                          default: kubernetes.io/hostname
                          type: string
                      type: object
                    type: array
                  requiredSelfAntiAffinity:
                    properties:
                      topologyKey:
                        default: kubernetes.io/hostname
                        type: string
                    type: object
                  preferredSelfAntiAffinity:
                    properties:
                      weight:
                        default: 100
                        format: int32
                        type: integer
                      topologyKey:
                        default: kubernetes.io/hostname
                        type: string
                    type: object
                type: object
              updateStrategy:
                properties:
                  type:
                    default: RollingUpdate
                    pattern: RollingUpdate|OnDelete
                    type: string
                  rollingUpdate:
                    properties:
                      maxUnavailable:
                        default: 1
                        format: int32
                        maximum: 9.0
                        minimum: 1.0
                        type: integer
                      preUpdateBackup:
                        default: true
                        type: boolean
                      healthCheckTimeoutSeconds:
                        default: 300
                        format: int32
                        type: integer
                      pauseBetweenPodsSeconds:
                        default: 60
                        format: int32
                        type: integer
                      updateSecondariesFirst:
                        default: true
                        type: boolean
                      failoverBeforePrimaryUpdate:
                        default: true
                        type: boolean
                    type: object
                type: object
              configurationRef:
                properties:
                  name:
                    type: string
                type: object
              networkPolicy:
                properties:
                  enabled:
                    type: boolean
                  allowedNamespaces:
                    items:
                      type: string
                    type: array
                  operatorNamespace:
                    description: "Deprecated — the operator namespace is sourced from the operator's own POD_NAMESPACE env var, not from each user CR (a wrong value here cut the operator off from its instance). Ignored by the controller."
                    type: string
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              tolerations:
                items:
                  properties:
                    effect:
                      type: string
                    key:
                      type: string
                    operator:
                      type: string
                    tolerationSeconds:
                      format: int64
                      type: integer
                    value:
                      type: string
                  type: object
                type: array
              priorityClassName:
                type: string
              runtimeClassName:
                type: string
              shutdown:
                description: 'Pod shutdown behaviour: grace period for clean checkpointing.'
                properties:
                  gracePeriodSeconds:
                    default: 180
                    description: terminationGracePeriodSeconds — SQL Server needs time to checkpoint; the k8s default of 30s SIGKILLs sqlservr mid-checkpoint and forces a long crash-recovery.
                    format: int64
                    type: integer
                type: object
              podDisruptionBudget:
                description: Optional PDB. maxUnavailable=0 makes node drains wait for an explicit, controlled eviction of the SQL pod — that is the point, and it does block drains until the pod is moved; enable knowingly.
                properties:
                  enabled:
                    type: boolean
                type: object
              podSecurityContext:
                properties:
                  appArmorProfile:
                    properties:
                      localhostProfile:
                        type: string
                      type:
                        type: string
                    type: object
                  fsGroup:
                    format: int64
                    type: integer
                  fsGroupChangePolicy:
                    type: string
                  runAsGroup:
                    format: int64
                    type: integer
                  runAsNonRoot:
                    type: boolean
                  runAsUser:
                    format: int64
                    type: integer
                  seLinuxChangePolicy:
                    type: string
                  seLinuxOptions:
                    properties:
                      level:
                        type: string
                      role:
                        type: string
                      type:
                        type: string
                      user:
                        type: string
                    type: object
                  seccompProfile:
                    properties:
                      localhostProfile:
                        type: string
                      type:
                        type: string
                    type: object
                  supplementalGroups:
                    items:
                      format: int64
                      type: integer
                    type: array
                  supplementalGroupsPolicy:
                    type: string
                  sysctls:
                    items:
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      type: object
                    type: array
                  windowsOptions:
                    properties:
                      gmsaCredentialSpec:
                        type: string
                      gmsaCredentialSpecName:
                        type: string
                      hostProcess:
                        type: boolean
                      runAsUserName:
                        type: string
                    type: object
                type: object
              securityContext:
                properties:
                  allowPrivilegeEscalation:
                    type: boolean
                  appArmorProfile:
                    properties:
                      localhostProfile:
                        type: string
                      type:
                        type: string
                    type: object
                  capabilities:
                    properties:
                      add:
                        items:
                          type: string
                        type: array
                      drop:
                        items:
                          type: string
                        type: array
                    type: object
                  privileged:
                    type: boolean
                  procMount:
                    type: string
                  readOnlyRootFilesystem:
                    type: boolean
                  runAsGroup:
                    format: int64
                    type: integer
                  runAsNonRoot:
                    type: boolean
                  runAsUser:
                    format: int64
                    type: integer
                  seLinuxOptions:
                    properties:
                      level:
                        type: string
                      role:
                        type: string
                      type:
                        type: string
                      user:
                        type: string
                    type: object
                  seccompProfile:
                    properties:
                      localhostProfile:
                        type: string
                      type:
                        type: string
                    type: object
                  windowsOptions:
                    properties:
                      gmsaCredentialSpec:
                        type: string
                      gmsaCredentialSpecName:
                        type: string
                      hostProcess:
                        type: boolean
                      runAsUserName:
                        type: string
                    type: object
                type: object
              machineKeySecretRef:
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              smkBackupPasswordSecretRef:
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
            type: object
          status:
            properties:
              phase:
                default: Pending
                type: string
              observedGeneration:
                format: int64
                type: integer
              version:
                type: string
              edition:
                type: string
              endpoint:
                type: string
              memory:
                properties:
                  podLimitMb:
                    description: Pod resources.limits.memory in MB.
                    format: int32
                    type: integer
                  sqlMaxMemoryMb:
                    description: sp_configure 'max server memory' value applied in MB.
                    format: int32
                    type: integer
                  sqlMinMemoryMb:
                    description: sp_configure 'min server memory' value applied in MB (0 if not set).
                    format: int32
                    type: integer
                  systemReserveMb:
                    description: System reserve in MB.
                    format: int32
                    type: integer
                  aligned:
                    description: True if the SQL Server configuration matches the calculated value.
                    type: boolean
                type: object
              podStatuses:
                items:
                  properties:
                    name:
                      type: string
                    ready:
                      type: boolean
                    role:
                      type: string
                  type: object
                type: array
              conditions:
                items:
                  properties:
                    type:
                      maxLength: 316
                      type: string
                    status:
                      default: "False"
                      description: True | False | Unknown (metav1.ConditionStatus).
                      type: string
                    reason:
                      default: Unknown
                      description: PascalCase machine-readable reason (required by metav1.Condition).
                      maxLength: 1024
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The .metadata.generation the condition was computed against (metav1.Condition).
                      format: int64
                      type: integer
                    lastTransitionTime:
                      format: date-time
                      type: string
                  required:
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}