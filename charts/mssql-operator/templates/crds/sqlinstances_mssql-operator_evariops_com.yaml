apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqlinstances.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlInstance
    listKind: SqlInstanceList
    plural: sqlinstances
    singular: sqlinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.version
      name: Version
      priority: 1
      type: string
    - jsonPath: .status.cumulativeUpdate
      name: CU
      priority: 1
      type: string
    - jsonPath: .status.productVersion
      name: Build
      priority: 1
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              automation:
                description: 'What the operator may do on its own for this resource (Observe, Plan, Apply), and the destructive actions pre-authorized within its budget.'
                properties:
                  mode:
                    default: Apply
                    description: Observe (decide and report, act on nothing), Plan (also expose the plan) or Apply (act).
                    enum:
                    - Observe
                    - Plan
                    - Apply
                    type: string
                  preAuthorized:
                    description: Destructive action types the operator may run without an approval, within its budget (one per resource an hour).
                    items:
                      type: string
                    type: array
                type: object
              mode:
                default: SingleNode
                type: string
              version:
                default: "2022"
                type: string
              edition:
                default: Developer
                type: string
              cumulativeUpdate:
                description: "The exact cumulative update this instance runs — RTM, CU25, or CU32-GDR1 — resolved against the OS base the operator ships for version. Omit it to follow the operator's pinned default for that version, which moves when the operator is upgraded; set it to hold an instance on a build of your own choosing. Mutually exclusive with imageTag, and never backwards: admission rejects a CU downgrade, which SQL Server cannot perform in place."
                pattern: ^(RTM|CU[0-9]+)(-GDR[0-9]*)?$
                type: string
              baseOs:
                description: "The OS base the image is built on — ubuntu-22.04, ubuntu-24.04. Each major version ships under its own set (2019: 20.04; 2022: 22.04, 20.04; 2025: 22.04, 24.04) and admission rejects a base that version never shipped. Omit it to follow the operator's default for the version — which, unlike the CU, is deliberately NOT moved by an image bump: re-basing a fleet is a decision, not a side effect. Mutually exclusive with imageTag."
                pattern: ^ubuntu-[0-9]{2}\.[0-9]{2}$
                type: string
              image:
                type: string
              imageTag:
                type: string
              memory:
                properties:
                  total:
                    description: Total memory allocated to the pod (e.g. "16Gi"). Sets both requests and limits for Guaranteed QoS.
                    type: string
                  systemReserve:
                    default: 2Gi
                    description: Memory reserved for OS, SQL Agent, sidecars. Default "2Gi". SQL max memory = Total - SystemReserve.
                    type: string
                  minMemory:
                    description: "Optional: sp_configure 'min server memory' (e.g. \"8Gi\"). If omitted, SQL Server uses its default (0)."
                    type: string
                type: object
              resources:
                properties:
                  requests:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                      ephemeralStorage:
                        description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                        type: string
                    type: object
                  limits:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                      ephemeralStorage:
                        description: 'The pod writes to ephemeral storage (SMK temp files, errorlog without a dedicated volume); without a request, disk-pressure eviction is unmanaged.'
                        type: string
                    type: object
                  cpuPinning:
                    type: boolean
                type: object
              storage:
                properties:
                  data:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                      rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                  sysDb:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                      rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                  log:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                      rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                  tempDb:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                      rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                  backup:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                      rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                  errorLogs:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                      rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                  certBackups:
                    properties:
                      size:
                        default: 10Gi
                        type: string
                      storageClassName:
                        type: string
                      accessModes:
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: 'storageClassName is immutable: changing the storage class requires a data migration'
                      rule: has(self.storageClassName) == has(oldSelf.storageClassName) && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                type: object
                x-kubernetes-validations:
                - message: an optional volume cannot be added to or removed from an existing resource
                  rule: has(self.sysDb) == has(oldSelf.sysDb)
                - message: an optional volume cannot be added to or removed from an existing resource
                  rule: has(self.tempDb) == has(oldSelf.tempDb)
                - message: an optional volume cannot be added to or removed from an existing resource
                  rule: has(self.errorLogs) == has(oldSelf.errorLogs)
                - message: an optional volume cannot be added to or removed from an existing resource
                  rule: has(self.certBackups) == has(oldSelf.certBackups)
              service:
                properties:
                  type:
                    default: ClusterIP
                    pattern: ^(ClusterIP|NodePort|LoadBalancer)$
                    type: string
                  port:
                    default: 1433
                    format: int32
                    maximum: 65535.0
                    minimum: 1024.0
                    type: integer
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              saPasswordSecretRef:
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              antiAffinity:
                properties:
                  requiredAntiAffinityWith:
                    items:
                      properties:
                        instanceName:
                          type: string
                        topologyKey:
                          default: kubernetes.io/hostname
                          type: string
                      type: object
                    type: array
                  preferredAntiAffinityWith:
                    items:
                      properties:
                        weight:
                          default: 100
                          format: int32
                          type: integer
                        instanceName:
                          type: string
                        topologyKey:
                          default: kubernetes.io/hostname
                          type: string
                      type: object
                    type: array
                  requiredSelfAntiAffinity:
                    properties:
                      topologyKey:
                        default: kubernetes.io/hostname
                        type: string
                    type: object
                  preferredSelfAntiAffinity:
                    properties:
                      weight:
                        default: 100
                        format: int32
                        type: integer
                      topologyKey:
                        default: kubernetes.io/hostname
                        type: string
                    type: object
                type: object
              topologySpread:
                description: Topology spread & cross-instance placement.
                properties:
                  self:
                    description: Spread THIS resource's own pods (e.g. AG replicas) across the topology. Selector is the resource identity label only (stable across in-place version upgrades).
                    properties:
                      node:
                        description: Spread across kubernetes.io/hostname. "Required" (DoNotSchedule) | "Preferred" (ScheduleAnyway) | null (off).
                        type: string
                      zone:
                        description: Spread across topology.kubernetes.io/zone. "Required" | "Preferred" | null.
                        type: string
                      maxSkew:
                        default: 1
                        description: Maximum allowed difference in pod count between topology domains. Default 1.
                        format: int32
                        type: integer
                      minDomains:
                        description: Minimum number of domains that must be occupied. Only honoured with a Required rule.
                        format: int32
                        type: integer
                    type: object
                  pool:
                    description: Spread the pods of ALL resources sharing spec.pool across the topology. Requires spec.pool to be set.
                    properties:
                      node:
                        description: Spread across kubernetes.io/hostname. "Required" (DoNotSchedule) | "Preferred" (ScheduleAnyway) | null (off).
                        type: string
                      zone:
                        description: Spread across topology.kubernetes.io/zone. "Required" | "Preferred" | null.
                        type: string
                      maxSkew:
                        default: 1
                        description: Maximum allowed difference in pod count between topology domains. Default 1.
                        format: int32
                        type: integer
                      minDomains:
                        description: Minimum number of domains that must be occupied. Only honoured with a Required rule.
                        format: int32
                        type: integer
                    type: object
                  poolAntiAffinity:
                    description: 'Strict cross-pool separation on the hostname (pod anti-affinity, not spread): no two pool members on the same node. "Required" | "Preferred". Requires spec.pool.'
                    type: string
                  constraints:
                    description: 'Escape hatch: raw native constraints appended verbatim (minDomains, matchLabelKeys, nodeAffinityPolicy, nodeTaintsPolicy, ...).'
                    items:
                      properties:
                        labelSelector:
                          properties:
                            matchExpressions:
                              items:
                                properties:
                                  key:
                                    type: string
                                  operator:
                                    type: string
                                  values:
                                    items:
                                      type: string
                                    type: array
                                type: object
                              type: array
                            matchLabels:
                              additionalProperties:
                                type: string
                              type: object
                          type: object
                        matchLabelKeys:
                          items:
                            type: string
                          type: array
                        maxSkew:
                          format: int32
                          type: integer
                        minDomains:
                          format: int32
                          type: integer
                        nodeAffinityPolicy:
                          type: string
                        nodeTaintsPolicy:
                          type: string
                        topologyKey:
                          type: string
                        whenUnsatisfiable:
                          type: string
                      type: object
                    type: array
                type: object
              pool:
                description: Cross-resource grouping label for pool-scoped spread / anti-affinity.
                type: string
              updateStrategy:
                properties:
                  type:
                    default: RollingUpdate
                    pattern: ^(RollingUpdate|OnDelete)$
                    type: string
                  rollingUpdate:
                    properties:
                      maxUnavailable:
                        default: 1
                        format: int32
                        maximum: 9.0
                        minimum: 1.0
                        type: integer
                      preUpdateBackup:
                        description: 'Not implemented: no backup is taken before a replica restarts. Admission refuses true.'
                        type: boolean
                      healthCheckTimeoutSeconds:
                        default: 300
                        format: int32
                        type: integer
                      pauseBetweenPodsSeconds:
                        default: 60
                        format: int32
                        type: integer
                      updateSecondariesFirst:
                        default: true
                        type: boolean
                      failoverBeforePrimaryUpdate:
                        default: true
                        type: boolean
                    type: object
                type: object
              configurationRef:
                properties:
                  name:
                    type: string
                type: object
              networkPolicy:
                properties:
                  enabled:
                    type: boolean
                  allowedNamespaces:
                    items:
                      type: string
                    type: array
                  operatorNamespace:
                    description: "Deprecated — the operator namespace is sourced from the operator's own POD_NAMESPACE env var, not from each user CR (a wrong value here cut the operator off from its instance). Ignored by the controller."
                    type: string
                  egress:
                    description: "Destinations the SQL pods may reach besides DNS and the other replicas — an SMTP relay (Database Mail), object storage (BACKUP TO URL), linked servers. Without a rule, the policy lets nothing else out."
                    items:
                      description: "One egress destination of the SQL pods. Give exactly one kind of destination: DNS names, CIDR blocks, or in-cluster pods (namespace and/or labels)."
                      properties:
                        name:
                          description: What the rule is for (smtp, backups, a linked server) — documentation only.
                          type: string
                        fqdns:
                          description: DNS names (Cilium toFQDNs); a leading *. matches the subdomains.
                          items:
                            type: string
                          type: array
                        cidrs:
                          description: CIDR blocks outside the cluster.
                          items:
                            type: string
                          type: array
                        namespace:
                          description: In-cluster pods of this namespace (the instance's own when only labels are given).
                          type: string
                        podLabels:
                          additionalProperties:
                            type: string
                          description: In-cluster pods carrying these labels.
                          type: object
                        ports:
                          description: TCP ports allowed to the destination (1–65535).
                          items:
                            format: int32
                            type: integer
                          type: array
                      type: object
                    type: array
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              tolerations:
                items:
                  properties:
                    effect:
                      type: string
                    key:
                      type: string
                    operator:
                      type: string
                    tolerationSeconds:
                      format: int64
                      type: integer
                    value:
                      type: string
                  type: object
                type: array
              priorityClassName:
                type: string
              runtimeClassName:
                type: string
              podAnnotations:
                additionalProperties:
                  type: string
                description: 'Annotations added to the pod — for what a node agent reads from the pod, such as cpu.preserve.resource-policy.nri.io: "true", which keeps an NRI resource policy from resizing SQL Server''s cpuset under it. Keys of the operator''s domain are refused.'
                type: object
              shutdown:
                description: 'Pod shutdown behaviour: grace period for clean checkpointing.'
                properties:
                  gracePeriodSeconds:
                    default: 180
                    description: terminationGracePeriodSeconds — SQL Server needs time to checkpoint; the k8s default of 30s SIGKILLs sqlservr mid-checkpoint and forces a long crash-recovery.
                    format: int64
                    type: integer
                type: object
              probes:
                description: Probe budgets. Tolerant defaults; raise them for instances whose login latency spikes under load, so a slowdown is not amplified into an outage.
                properties:
                  readinessFailureThreshold:
                    default: 6
                    description: Consecutive readiness failures before the pod leaves the Service. Default 6 (≈1 min).
                    format: int32
                    maximum: 60.0
                    minimum: 1.0
                    type: integer
                  readinessTimeoutSeconds:
                    default: 10
                    description: Readiness probe timeout, also used as the sqlcmd login timeout (-l). Default 10s.
                    format: int32
                    maximum: 60.0
                    minimum: 1.0
                    type: integer
                  startupFailureThreshold:
                    default: 90
                    description: Startup probe failures (10s period) before the container is restarted. Default 90 (15 min), which is the budget for the master upgrade scripts of a cumulative update.
                    format: int32
                    maximum: 720.0
                    minimum: 1.0
                    type: integer
                  livenessFailureThreshold:
                    default: 5
                    description: Liveness failures (30s period) before the container is restarted. Default 5.
                    format: int32
                    maximum: 60.0
                    minimum: 1.0
                    type: integer
                  requireDatabasesRecovered:
                    default: true
                    description: "Whether readiness requires every user database to be out of crash recovery. Default true: SELECT 1 on master answers minutes before the databases are usable, so the pod used to re-enter the Service while the application got errors 922/945 on every query. This setting is the escape hatch. The check is all-or-nothing: ONE database stuck in RECOVERY_PENDING for good (a lost file, a missing filegroup) keeps the pod NotReady forever, which removes it from the headless Service, makes it unreachable to the operator's own health probes, and hands a single broken database the power to look like a dead replica. Set this to false to serve the other fifty databases while the broken one is repaired."
                    type: boolean
                type: object
              podDisruptionBudget:
                description: Optional PDB. maxUnavailable=0 makes node drains wait for an explicit, controlled eviction of the SQL pod — that is the point, and it does block drains until the pod is moved; enable knowingly.
                properties:
                  enabled:
                    type: boolean
                type: object
              podSecurityContext:
                properties:
                  appArmorProfile:
                    properties:
                      localhostProfile:
                        type: string
                      type:
                        type: string
                    type: object
                  fsGroup:
                    format: int64
                    type: integer
                  fsGroupChangePolicy:
                    type: string
                  runAsGroup:
                    format: int64
                    type: integer
                  runAsNonRoot:
                    type: boolean
                  runAsUser:
                    format: int64
                    type: integer
                  seLinuxChangePolicy:
                    type: string
                  seLinuxOptions:
                    properties:
                      level:
                        type: string
                      role:
                        type: string
                      type:
                        type: string
                      user:
                        type: string
                    type: object
                  seccompProfile:
                    properties:
                      localhostProfile:
                        type: string
                      type:
                        type: string
                    type: object
                  supplementalGroups:
                    items:
                      format: int64
                      type: integer
                    type: array
                  supplementalGroupsPolicy:
                    type: string
                  sysctls:
                    items:
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      type: object
                    type: array
                  windowsOptions:
                    properties:
                      gmsaCredentialSpec:
                        type: string
                      gmsaCredentialSpecName:
                        type: string
                      hostProcess:
                        type: boolean
                      runAsUserName:
                        type: string
                    type: object
                type: object
              securityContext:
                properties:
                  allowPrivilegeEscalation:
                    type: boolean
                  appArmorProfile:
                    properties:
                      localhostProfile:
                        type: string
                      type:
                        type: string
                    type: object
                  capabilities:
                    properties:
                      add:
                        items:
                          type: string
                        type: array
                      drop:
                        items:
                          type: string
                        type: array
                    type: object
                  privileged:
                    type: boolean
                  procMount:
                    type: string
                  readOnlyRootFilesystem:
                    type: boolean
                  runAsGroup:
                    format: int64
                    type: integer
                  runAsNonRoot:
                    type: boolean
                  runAsUser:
                    format: int64
                    type: integer
                  seLinuxOptions:
                    properties:
                      level:
                        type: string
                      role:
                        type: string
                      type:
                        type: string
                      user:
                        type: string
                    type: object
                  seccompProfile:
                    properties:
                      localhostProfile:
                        type: string
                      type:
                        type: string
                    type: object
                  windowsOptions:
                    properties:
                      gmsaCredentialSpec:
                        type: string
                      gmsaCredentialSpecName:
                        type: string
                      hostProcess:
                        type: boolean
                      runAsUserName:
                        type: string
                    type: object
                type: object
              tls:
                description: The certificate SQL Server presents.
                properties:
                  secretName:
                    description: "A kubernetes.io/tls Secret (tls.crt, tls.key) in the resource's namespace. Its SANs must cover the names clients connect to: <instance>.<namespace>.svc.cluster.local for an instance; *.<ag>-headless.<namespace>.svc.cluster.local and the listener Services for an availability group. SQL Server reads it at startup: a renewal takes effect at the next restart."
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                  forceEncryption:
                    description: Refuse unencrypted client connections (mssql.conf network.forceencryption).
                    type: boolean
                type: object
              machineKeySecretRef:
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
              smkBackupPasswordSecretRef:
                properties:
                  name:
                    type: string
                  key:
                    type: string
                type: object
            type: object
            x-kubernetes-validations:
            - message: 'spec.mode is immutable: converting between SingleNode and AvailabilityGroupMember is not an in-place operation'
              rule: has(self.mode) == has(oldSelf.mode) && (!has(self.mode) || self.mode == oldSelf.mode)
          status:
            properties:
              phase:
                default: Pending
                type: string
              observedGeneration:
                format: int64
                type: integer
              version:
                type: string
              edition:
                type: string
              image:
                description: The image the operator resolved from version/cumulativeUpdate/image/imageTag — the build the instance is meant to run.
                type: string
              cumulativeUpdate:
                description: The patch level that image deploys, e.g. CU25. Null for an image whose tag the operator cannot read (a custom reference or a digest).
                type: string
              baseOs:
                description: The OS base that image is built on, e.g. ubuntu-22.04.
                type: string
              productVersion:
                description: SERVERPROPERTY('ProductVersion') of the engine actually answering, e.g. 16.0.4195.2. What image says is desired; this is what is running — they differ while a pod is still on the old image, and that gap is the only honest signal that a CU upgrade has not landed yet.
                type: string
              endpoint:
                type: string
              machineKeySha256:
                description: 'sha256 of the machine key the data was created with. A mounted key with another fingerprint sets MachineKeyChanged: the Service Master Key on the volumes needs the original.'
                type: string
              maintenance:
                description: 'The pod a node maintenance is about to stop, and the signals seen.'
                properties:
                  mode:
                    description: 'Off, Shadow or Enforce: the NodeMaintenance switch in force for the resource. In Shadow, the signals and decisions are published and nothing is acted on.'
                    type: string
                  pods:
                    items:
                      properties:
                        pod:
                          type: string
                        node:
                          type: string
                        signals:
                          description: 'Kinds of the signals seen: Eviction, Deletion, KubeletTermination, Disruption, Cordon, Taint, NodeShutdown.'
                          items:
                            type: string
                          type: array
                        since:
                          description: When the operator first saw a signal for this pod.
                          format: date-time
                          type: string
                        requestedAt:
                          description: 'When the eviction webhook first saw an eviction of the pod.'
                          format: date-time
                          type: string
                        requestedBy:
                          description: 'Who asked for the eviction (the user of the admission request); a node identity (system:node:...) is the drain of talosctl upgrade.'
                          type: string
                        deadline:
                          description: When the eviction goes on at the latest, whatever the verdict.
                          format: date-time
                          type: string
                        verdict:
                          description: 'Allow or Delay: the verdict on the eviction. In Shadow, the verdict Enforce would give.'
                          type: string
                        reason:
                          description: 'Why: the message of the 429 while the eviction is delayed.'
                          type: string
                      type: object
                    type: array
                type: object
              memory:
                properties:
                  podLimitMb:
                    description: Pod resources.limits.memory in MB.
                    format: int32
                    type: integer
                  sqlMaxMemoryMb:
                    description: sp_configure 'max server memory' value applied in MB.
                    format: int32
                    type: integer
                  sqlMinMemoryMb:
                    description: sp_configure 'min server memory' value applied in MB (0 if not set).
                    format: int32
                    type: integer
                  systemReserveMb:
                    description: System reserve in MB.
                    format: int32
                    type: integer
                  aligned:
                    description: True if the SQL Server configuration matches the calculated value.
                    type: boolean
                type: object
              fullText:
                description: 'Full-Text Search state: what the operator was previously blind to.'
                properties:
                  installed:
                    description: Whether the Full-Text Search package is installed on this instance.
                    type: boolean
                  upgradeOption:
                    description: "sp_fulltext_service 'upgrade_option': Import | Rebuild | Reset. Rebuild/Reset repopulate every catalogue on the first boot after an engine upgrade."
                    type: string
                  activePopulations:
                    description: Population crawls currently queued or running.
                    format: int32
                    type: integer
                type: object
              podStatuses:
                items:
                  properties:
                    name:
                      type: string
                    ready:
                      type: boolean
                    role:
                      type: string
                  type: object
                type: array
              conditions:
                items:
                  properties:
                    type:
                      maxLength: 316
                      type: string
                    status:
                      default: "False"
                      description: True | False | Unknown (metav1.ConditionStatus).
                      type: string
                    reason:
                      default: Unknown
                      description: PascalCase machine-readable reason (required by metav1.Condition).
                      maxLength: 1024
                      type: string
                    message:
                      maxLength: 32768
