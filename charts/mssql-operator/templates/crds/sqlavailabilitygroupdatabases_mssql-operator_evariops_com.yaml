apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqlavailabilitygroupdatabases.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlAvailabilityGroupDatabase
    listKind: SqlAvailabilityGroupDatabaseList
    plural: sqlavailabilitygroupdatabases
    shortNames:
    - sagdb
    singular: sqlavailabilitygroupdatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.availabilityGroupName
      name: AG
      type: string
    - jsonPath: .status.databaseName
      name: Database
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              availabilityGroupRef:
                description: Reference to the parent SqlAvailabilityGroup (same namespace).
                properties:
                  name:
                    type: string
                type: object
              databaseName:
                description: Name of the database. Must already exist on the primary, be ONLINE, FULL recovery.
                type: string
              seedingMode:
                default: Automatic
                description: Automatic | Manual. Defaults to Automatic.
                type: string
              dataMovement:
                description: Data movement control (suspend/resume).
                properties:
                  suspended:
                    description: If true, the operator executes ALTER DATABASE SET HADR SUSPEND.
                    type: boolean
                  requireManualResumeAfterDataLoss:
                    default: true
                    description: If true, block automatic HADR RESUME after a forced failover with data loss.
                    type: boolean
                type: object
              logBackup:
                description: Log backups the operator takes when nothing else truncates the log, into /var/opt/mssql/backup/mssql-operator on the primary.
                properties:
                  mode:
                    default: Auto
                    description: Auto backs the log up when it is at least thresholdPercent full and nothing else truncated it (log_reuse_wait LOG_BACKUP), so it never acts while another tool backs the log up often enough. Disabled never does.
                    enum:
                    - Auto
                    - Disabled
                    type: string
                  thresholdPercent:
                    default: 50
                    description: Log usage (percent) from which the operator backs the log up.
                    format: int32
                    maximum: 90
                    minimum: 10
                    type: integer
                  retentionHours:
                    default: 24
                    description: The operator's log backups older than this are deleted from its folder on the replica that took them.
                    format: int32
                    maximum: 720
                    minimum: 1
                    type: integer
                type: object
            type: object
          status:
            properties:
              phase:
                default: Pending
                description: Pending | WaitingForAg | Adding | Seeding | Synchronized | Synchronizing | Suspended | NotSynchronizing | Removing | Failed.
                type: string
              observedGeneration:
                format: int64
                type: integer
              availabilityGroupName:
                type: string
              databaseName:
                type: string
              replicaStates:
                description: Synchronization state per replica.
                items:
                  properties:
                    replica:
                      type: string
                    role:
                      default: Unknown
                      description: Primary | Secondary.
                      type: string
                    synchronizationState:
                      default: Unknown
                      description: Synchronized | Synchronizing | NotSynchronizing | Suspended.
                      type: string
                    isFailoverReady:
                      type: boolean
                  type: object
                type: array
              consecutiveResumeAttempts:
                description: Consecutive HADR RESUME attempts that did not bring the database back. After a few, the operator stops retrying and reports the real state instead of masking it behind a permanent "Synchronizing".
                format: int32
                type: integer
              dataLossResumeApprovedFor:
                description: Timestamp of the data-loss failover whose divergent replicas were approved to rejoin. The approve-data-loss-resume annotation is consumed into it and holds for that failover only.
                format: date-time
                type: string
              resolvedDivergences:
                description: 'Divergences of the AG (openDivergences ids) this database has settled: its rejoin was approved (the approval annotation is consumed into it), or the divergent copy was re-seeded. Only ids still open on the AG are kept.'
                items:
                  type: string
                type: array
              fruitlessResumeRounds:
                description: Rounds of HADR RESUME attempts that ended without the database coming back; at the second, a stuck replica is re-seeded automatically. Reset once nothing is suspended.
                format: int32
                type: integer
              reseededAt:
                description: When each replica was last re-seeded. An automatic re-seed of the same replica is not repeated within the hour.
                additionalProperties:
                  format: date-time
                  type: string
                type: object
              reseedAttempts:
                description: Seeding attempts of the current re-seed of each replica; a seeding that fails (typically a log backup between the seeding and the join, error 1412) is retried a few times.
                additionalProperties:
                  format: int32
                  type: integer
                type: object
              conditions:
                items:
                  properties:
                    type:
                      maxLength: 316
                      type: string
                    status:
                      default: "False"
                      description: True | False | Unknown (metav1.ConditionStatus).
                      type: string
                    reason:
                      default: Unknown
                      description: PascalCase machine-readable reason (required by metav1.Condition).
                      maxLength: 1024
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The .metadata.generation the condition was computed against (metav1.Condition).
                      format: int64
                      type: integer
                    lastTransitionTime:
                      format: date-time
                      type: string
                  required:
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}