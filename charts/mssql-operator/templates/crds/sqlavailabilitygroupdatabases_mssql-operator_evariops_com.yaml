apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: sqlavailabilitygroupdatabases.mssql-operator.evariops.com
spec:
  group: mssql-operator.evariops.com
  names:
    kind: SqlAvailabilityGroupDatabase
    listKind: SqlAvailabilityGroupDatabaseList
    plural: sqlavailabilitygroupdatabases
    shortNames:
    - sagdb
    singular: sqlavailabilitygroupdatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.availabilityGroupName
      name: AG
      type: string
    - jsonPath: .status.databaseName
      name: Database
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              availabilityGroupRef:
                description: Reference to the parent SqlAvailabilityGroup (same namespace).
                properties:
                  name:
                    type: string
                type: object
              databaseName:
                description: Name of the database. Must already exist on the primary, be ONLINE, FULL recovery.
                type: string
              seedingMode:
                default: Automatic
                description: Automatic | Manual. Defaults to Automatic.
                type: string
              dataMovement:
                description: Data movement control (suspend/resume).
                properties:
                  suspended:
                    description: If true, the operator executes ALTER DATABASE SET HADR SUSPEND.
                    type: boolean
                  requireManualResumeAfterDataLoss:
                    default: true
                    description: If true, block automatic HADR RESUME after a forced failover with data loss.
                    type: boolean
                type: object
            type: object
          status:
            properties:
              phase:
                default: Pending
                description: Pending | WaitingForAg | Adding | Seeding | Synchronized | Synchronizing | Suspended | NotSynchronizing | Removing | Failed.
                type: string
              observedGeneration:
                format: int64
                type: integer
              availabilityGroupName:
                type: string
              databaseName:
                type: string
              replicaStates:
                description: Synchronization state per replica.
                items:
                  properties:
                    replica:
                      type: string
                    role:
                      default: Unknown
                      description: Primary | Secondary.
                      type: string
                    synchronizationState:
                      default: Unknown
                      description: Synchronized | Synchronizing | NotSynchronizing | Suspended.
                      type: string
                    isFailoverReady:
                      type: boolean
                  type: object
                type: array
              lastObservedAt:
                description: When the synchronization state was last actually read from the primary. A stale value with a healthy-looking phase means the operator has been blind, not that the database is fine — the SyncStateUnknown condition says so explicitly.
                format: date-time
                type: string
              consecutiveResumeAttempts:
                description: Consecutive HADR RESUME attempts that did not bring the database back. After a few, the operator stops retrying and reports the real state instead of masking it behind a permanent "Synchronizing".
                format: int32
                type: integer
              conditions:
                items:
                  properties:
                    type:
                      maxLength: 316
                      type: string
                    status:
                      default: "False"
                      description: True | False | Unknown (metav1.ConditionStatus).
                      type: string
                    reason:
                      default: Unknown
                      description: PascalCase machine-readable reason (required by metav1.Condition).
                      maxLength: 1024
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The .metadata.generation the condition was computed against (metav1.Condition).
                      format: int64
                      type: integer
                    lastTransitionTime:
                      format: date-time
                      type: string
                  required:
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}