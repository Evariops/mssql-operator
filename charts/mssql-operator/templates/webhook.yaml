{{- if .Values.webhook.enabled }}
{{- $fullname := include "mssql-operator.fullname" . }}
{{- $svcName := printf "%s-webhook" $fullname }}
{{- $secretName := printf "%s-webhook-tls" $fullname }}
{{- $ns := .Release.Namespace }}
{{- $cn := printf "%s.%s.svc" $svcName $ns }}
{{- $altNames := list $svcName (printf "%s.%s" $svcName $ns) $cn (printf "%s.cluster.local" $cn) }}
{{/*
Reuse the existing serving cert across upgrades so the caBundle stays valid; only generate a new
self-signed CA + cert on first install (when no Secret exists yet). Values under data: are base64.
*/}}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $caCert := "" }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- if and $existing $existing.data (index $existing.data "ca.crt") }}
{{- $caCert = index $existing.data "ca.crt" }}
{{- $tlsCert = index $existing.data "tls.crt" }}
{{- $tlsKey = index $existing.data "tls.key" }}
{{- else }}
{{- $ca := genCA (printf "%s-ca" $fullname) 3650 }}
{{- $cert := genSignedCert $cn nil $altNames 3650 $ca }}
{{- $caCert = $ca.Cert | b64enc }}
{{- $tlsCert = $cert.Cert | b64enc }}
{{- $tlsKey = $cert.Key | b64enc }}
{{- end }}
{{- $hooks := list
  (dict "kind" "sqlagentjob" "plural" "sqlagentjobs")
  (dict "kind" "sqlavailabilitygroup" "plural" "sqlavailabilitygroups")
  (dict "kind" "sqlavailabilitygroupdatabase" "plural" "sqlavailabilitygroupdatabases")
  (dict "kind" "sqlconfiguration" "plural" "sqlconfigurations")
  (dict "kind" "sqlinstance" "plural" "sqlinstances")
  (dict "kind" "sqlstoredprocedure" "plural" "sqlstoredprocedures")
  (dict "kind" "sqltdecertificate" "plural" "sqltdecertificates")
  (dict "kind" "sqluser" "plural" "sqlusers")
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert }}
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mssql-operator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
webhooks:
{{- range $h := $hooks }}
  - name: validate.{{ $h.kind }}.mssql.operator.v1alpha1
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Exact
    failurePolicy: {{ $.Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate/{{ $h.kind }}
        port: 443
      caBundle: {{ $caCert }}
    rules:
      - apiGroups: ["mssql.operator"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["{{ $h.plural }}"]
{{- end }}
{{- if .Values.viewApi.enabled }}
---
# Aggregated read-only API (view.mssql.operator): live per-item detail computed from SQL, never etcd.
# Reuses the webhook Service + serving cert/CA above (so caBundle stays valid across upgrades).
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.view.mssql.operator
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  group: view.mssql.operator
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ $svcName }}
    namespace: {{ $ns }}
    port: 443
  caBundle: {{ $caCert }}
---
# Authorization delegation: the operator creates SubjectAccessReviews/TokenReviews to authorize
# aggregated-API requests against normal RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-view-auth-delegator
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews", "tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-view-auth-delegator
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-view-auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "mssql-operator.serviceAccountName" . }}
    namespace: {{ $ns }}
---
# Read the requestheader config (front-proxy CA / allowed names) the aggregator presents.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-view-auth-reader
  namespace: kube-system
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "mssql-operator.serviceAccountName" . }}
    namespace: {{ $ns }}
---
# End-user read access to the virtual resources (bind to your viewers as needed).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-view-reader
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["view.mssql.operator"]
    resources: ["tdedatabasestates", "storedproceduredeployments"]
    verbs: ["get", "list"]
{{- end }}
{{- end }}
