{{- if .Values.webhook.enabled }}
{{- $fullname := include "mssql-operator.fullname" . }}
{{- $svcName := printf "%s-webhook" $fullname }}
{{- $secretName := printf "%s-webhook-tls" $fullname }}
{{- $ns := .Release.Namespace }}
{{- $cn := printf "%s.%s.svc" $svcName $ns }}
{{- $altNames := list $svcName (printf "%s.%s" $svcName $ns) $cn (printf "%s.cluster.local" $cn) }}
{{/*
Reuse the existing serving cert across upgrades so the caBundle stays valid; only generate a new
self-signed CA + cert on first install (when no Secret exists yet). Values under data: are base64.
*/}}
{{- $certManager := .Values.webhook.certManager.enabled }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $caCert := "" }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- if not $certManager }}
{{- if and $existing $existing.data (index $existing.data "ca.crt") }}
{{- $caCert = index $existing.data "ca.crt" }}
{{- $tlsCert = index $existing.data "tls.crt" }}
{{- $tlsKey = index $existing.data "tls.key" }}
{{- else }}
{{/* 1-year validity (was 10) — rotation is handled by the in-process certificate
     hot-reload; reinstalling within the year refreshes it. Prefer certManager.enabled for
     GitOps (the lookup above is empty during `helm template`/ArgoCD render, which would
     regenerate the CA on every sync and break admission with failurePolicy: Fail). */}}
{{- $ca := genCA (printf "%s-ca" $fullname) 365 }}
{{- $cert := genSignedCert $cn nil $altNames 365 $ca }}
{{- $caCert = $ca.Cert | b64enc }}
{{- $tlsCert = $cert.Cert | b64enc }}
{{- $tlsKey = $cert.Key | b64enc }}
{{- end }}
{{- end }}
{{- $hooks := list
  (dict "kind" "sqlagentjob" "plural" "sqlagentjobs")
  (dict "kind" "sqlavailabilitygroup" "plural" "sqlavailabilitygroups")
  (dict "kind" "sqlavailabilitygroupdatabase" "plural" "sqlavailabilitygroupdatabases")
  (dict "kind" "sqlconfiguration" "plural" "sqlconfigurations")
  (dict "kind" "sqlinstance" "plural" "sqlinstances")
  (dict "kind" "sqlstoredprocedure" "plural" "sqlstoredprocedures")
  (dict "kind" "sqltdecertificate" "plural" "sqltdecertificates")
  (dict "kind" "sqluser" "plural" "sqlusers")
}}
{{- if $certManager }}
# Cert-manager owns the serving certificate; the CA bundle is injected into the
# webhook/APIService below via cert-manager.io/inject-ca-from.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-webhook
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  secretName: {{ $secretName }}
  issuerRef:
    name: {{ $fullname }}-selfsigned
  dnsNames:
    {{- range $altNames }}
    - {{ . }}
    {{- end }}
---
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert }}
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mssql-operator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
  {{- if $certManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/{{ $fullname }}-webhook
  {{- end }}
webhooks:
{{- range $h := $hooks }}
  - name: validate.{{ $h.kind }}.mssql-operator.evariops.com.v1alpha1
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Exact
    failurePolicy: {{ $.Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate/{{ $h.kind }}
        port: 443
      {{- if not $certManager }}
      caBundle: {{ $caCert }}
      {{- end }}
    rules:
      - apiGroups: ["mssql-operator.evariops.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["{{ $h.plural }}"]
{{- end }}
{{- if .Values.viewApi.enabled }}
---
# Aggregated read-only API (view.mssql-operator.evariops.com): live per-item detail computed from SQL, never etcd.
# Reuses the webhook Service + serving cert/CA above (so caBundle stays valid across upgrades).
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.view.mssql-operator.evariops.com
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
  {{- if $certManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/{{ $fullname }}-webhook
  {{- end }}
spec:
  group: view.mssql-operator.evariops.com
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ $svcName }}
    namespace: {{ $ns }}
    port: 443
  {{- if not $certManager }}
  caBundle: {{ $caCert }}
  {{- end }}
---
# Authorization delegation: the operator creates SubjectAccessReviews/TokenReviews to authorize
# aggregated-API requests against normal RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-view-auth-delegator
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews", "tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-view-auth-delegator
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-view-auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "mssql-operator.serviceAccountName" . }}
    namespace: {{ $ns }}
---
# Read the requestheader config (front-proxy CA / allowed names) the aggregator presents.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-view-auth-reader
  namespace: kube-system
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "mssql-operator.serviceAccountName" . }}
    namespace: {{ $ns }}
---
# End-user read access to the virtual resources (bind to your viewers as needed).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-view-reader
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["view.mssql-operator.evariops.com"]
    resources: ["tdedatabasestates", "storedproceduredeployments", "sqlusertargets", "sqlagentjobruns", "agreplicastates"]
    verbs: ["get", "list"]
{{- end }}
{{- end }}
