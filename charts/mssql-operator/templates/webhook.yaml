{{- if .Values.webhook.enabled }}
{{- $fullname := include "mssql-operator.fullname" . }}
{{- $svcName := printf "%s-webhook" $fullname }}
{{- $secretName := printf "%s-webhook-tls" $fullname }}
{{- $ns := .Release.Namespace }}
{{- $cn := printf "%s.%s.svc" $svcName $ns }}
{{- $altNames := list $svcName (printf "%s.%s" $svcName $ns) $cn (printf "%s.cluster.local" $cn) }}
{{/*
Reuse the existing serving cert across upgrades so the caBundle stays valid; only generate a new
self-signed CA + cert on first install (when no Secret exists yet). Values under data: are base64.
*/}}
{{- $certManager := .Values.webhook.certManager.enabled }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $caCert := "" }}
{{- $caKey := "" }}
{{- $caNotAfter := "" }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- $certNotAfter := "" }}
{{- if not $certManager }}
{{/*
The existing certificate is reused ONLY while it is still valid for long enough.

The previous template reused it unconditionally, and the comment claimed "reinstalling within the
year refreshes it" — but `helm upgrade` reuses, it never regenerates. So on day 366 the serving
certificate simply expired: with failurePolicy: Fail, every CREATE/UPDATE of the 8 CRDs is rejected
cluster-wide (including the operator's own finalizer patches, so deletions hang in Terminating), and
the same certificate serves the aggregated APIService, whose discovery failure blocks the deletion of
every namespace in the cluster. A time bomb with a one-year fuse, armed at install.

The cert is regenerated when it expires in less than `webhook.certRenewBeforeDays` days. Regeneration
rewrites the caBundle in the same render, so admission stays consistent.
*/}}
{{- $renewBefore := int (.Values.webhook.certRenewBeforeDays | default 30) }}
{{- $reusable := false }}
{{- if and $existing $existing.data (index $existing.data "ca.crt") (index $existing.data "tls.crt") }}
{{- $reusable = true }}
{{/* Helm has no X.509 parser: the expiry is read from the annotation the chart stamped when it
     generated the certificate. A Secret created by an older chart has no annotation — regenerate,
     which is the safe answer for a cert of unknown age. */}}
{{- $expiry := (index (default (dict) $existing.metadata.annotations) "mssql-operator.evariops.com/cert-not-after") | default "" }}
{{- if empty $expiry }}
{{- $reusable = false }}
{{- else }}
{{- $daysLeft := div (sub (unixEpoch (toDate "2006-01-02T15:04:05Z07:00" $expiry)) (unixEpoch now)) 86400 }}
{{- if lt (int $daysLeft) $renewBefore }}
{{- $reusable = false }}
{{- end }}
{{- end }}
{{- end }}
{{/* The CA lives ten years and outlives the serving certificates it signs. A renewal
     then signs a new leaf with the SAME CA, so the caBundle does not move: the API server keeps
     trusting the pods that still serve the previous leaf until they reload the new one (the
     operator reloads it from the mounted Secret, no restart). The CA itself is regenerated only
     when it nears its own expiry, or when an older chart left no CA key behind. */}}
{{- $caAnnotations := default (dict) (and $existing $existing.metadata.annotations) }}
{{- $caNotAfter = (index $caAnnotations "mssql-operator.evariops.com/ca-not-after") | default "" }}
{{- if $reusable }}
{{- $caCert = index $existing.data "ca.crt" }}
{{- $caKey = index $existing.data "ca.key" | default "" }}
{{- $tlsCert = index $existing.data "tls.crt" }}
{{- $tlsKey = index $existing.data "tls.key" }}
{{/* Keep the expiry we recorded when this cert was generated — re-stamping "now + 1 year" on every
     upgrade would make the certificate look eternally fresh and defeat the renewal check. */}}
{{- $certNotAfter = (index $caAnnotations "mssql-operator.evariops.com/cert-not-after") | default "" }}
{{- else }}
{{- $ca := dict }}
{{- $caUsable := false }}
{{- if and $existing $existing.data (index $existing.data "ca.crt") (index $existing.data "ca.key") (not (empty $caNotAfter)) }}
{{- $caDaysLeft := div (sub (unixEpoch (toDate "2006-01-02T15:04:05Z07:00" $caNotAfter)) (unixEpoch now)) 86400 }}
{{- if gt (int $caDaysLeft) 400 }}
{{- $caUsable = true }}
{{- end }}
{{- end }}
{{- if $caUsable }}
{{- $ca = buildCustomCert (index $existing.data "ca.crt") (index $existing.data "ca.key") }}
{{- else }}
{{- $ca = genCA (printf "%s-ca" $fullname) 3650 }}
{{- $caNotAfter = (dateModify "87600h" now) | date "2006-01-02T15:04:05Z07:00" }}
{{- end }}
{{/* 1-year leaf. Prefer certManager.enabled for GitOps: the lookup above is empty during
     `helm template`/ArgoCD render, which regenerates the CA on every sync. */}}
{{- $cert := genSignedCert $cn nil $altNames 365 $ca }}
{{- $caCert = $ca.Cert | b64enc }}
{{- $caKey = $ca.Key | b64enc }}
{{- $tlsCert = $cert.Cert | b64enc }}
{{- $tlsKey = $cert.Key | b64enc }}
{{- $certNotAfter = (dateModify "8760h" now) | date "2006-01-02T15:04:05Z07:00" }}
{{- end }}
{{- end }}
{{- $hooks := list
  (dict "kind" "sqlagentjob" "plural" "sqlagentjobs")
  (dict "kind" "sqlavailabilitygroup" "plural" "sqlavailabilitygroups")
  (dict "kind" "sqlavailabilitygroupdatabase" "plural" "sqlavailabilitygroupdatabases")
  (dict "kind" "sqlconfiguration" "plural" "sqlconfigurations")
  (dict "kind" "sqlinstance" "plural" "sqlinstances")
  (dict "kind" "sqlstoredprocedure" "plural" "sqlstoredprocedures")
  (dict "kind" "sqltdecertificate" "plural" "sqltdecertificates")
  (dict "kind" "sqluser" "plural" "sqlusers")
}}
{{- if $certManager }}
# Cert-manager owns the serving certificate; the CA bundle is injected into the
# webhook/APIService below via cert-manager.io/inject-ca-from.
#
# A self-signed CA (ten years) issues the serving certificate. The injected bundle is that
# CA, so a renewal of the serving certificate leaves it unchanged — with the leaf self-signed, every
# renewal changed the bundle, and the API server rejected the pods still serving the old one.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-ca
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ $fullname }}-ca
  secretName: {{ $fullname }}-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ $fullname }}-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-ca
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $fullname }}-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-webhook
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  secretName: {{ $secretName }}
  issuerRef:
    name: {{ $fullname }}-ca
  dnsNames:
    {{- range $altNames }}
    - {{ . }}
    {{- end }}
---
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
  annotations:
    # The expiry of the certificate we just wrote. Helm cannot parse X.509, so the
    # renewal check on the next upgrade reads this instead of guessing. Without it, the cert was
    # reused for ever and silently expired one year after install — taking admission (failurePolicy:
    # Fail) and the aggregated API down with it.
    mssql-operator.evariops.com/cert-not-after: {{ $certNotAfter | quote }}
    mssql-operator.evariops.com/ca-not-after: {{ $caNotAfter | quote }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert }}
  {{- if $caKey }}
  ca.key: {{ $caKey }}
  {{- end }}
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $ns }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mssql-operator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
  {{- if $certManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/{{ $fullname }}-webhook
  {{- end }}
webhooks:
{{- range $h := $hooks }}
  - name: validate.{{ $h.kind }}.mssql-operator.evariops.com.v1alpha1
    admissionReviewVersions: ["v1"]
    sideEffects: None
    matchPolicy: Exact
    failurePolicy: {{ $.Values.webhook.failurePolicy }}
    # Explicit; the validators keep their API calls within 6 s (2 s each).
    timeoutSeconds: 10
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate/{{ $h.kind }}
        port: 443
      {{- if not $certManager }}
      caBundle: {{ $caCert }}
      {{- end }}
    rules:
      - apiGroups: ["mssql-operator.evariops.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["{{ $h.plural }}"]
{{- end }}
{{- if .Values.viewApi.enabled }}
---
# Aggregated read-only API (view.mssql-operator.evariops.com): live per-item detail computed from SQL, never etcd.
# Reuses the webhook Service + serving cert/CA above (so caBundle stays valid across upgrades).
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.view.mssql-operator.evariops.com
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
  {{- if $certManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/{{ $fullname }}-webhook
  {{- end }}
spec:
  group: view.mssql-operator.evariops.com
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ $svcName }}
    namespace: {{ $ns }}
    port: 443
  {{- if not $certManager }}
  caBundle: {{ $caCert }}
  {{- end }}
---
# Authorization delegation: the operator creates SubjectAccessReviews to authorize aggregated-API
# requests against normal RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-view-auth-delegator
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
rules:
  # Tokenreviews dropped — the aggregator is authenticated by its front-proxy certificate.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-view-auth-delegator
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-view-auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "mssql-operator.serviceAccountName" . }}
    namespace: {{ $ns }}
---
# Read the requestheader config (front-proxy CA / allowed names) the aggregator presents.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-view-auth-reader
  namespace: kube-system
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "mssql-operator.serviceAccountName" . }}
    namespace: {{ $ns }}
---
# End-user read access to the virtual resources (bind to your viewers as needed).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-view-reader
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["view.mssql-operator.evariops.com"]
    resources: ["tdedatabasestates", "storedproceduredeployments", "sqlusertargets", "sqlagentjobruns", "agreplicastates", "operatorplans", "logchains"]
    verbs: ["get", "list"]
{{- end }}
{{- end }}
