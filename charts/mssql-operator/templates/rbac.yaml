apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mssql-operator.fullname" . }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
# Every verb below is one the code uses. The operator watches its CRs in every namespace,
# hence a ClusterRole; it never deletes a user CR, a Secret, a Service, a ConfigMap or a PVC (the
# children are garbage-collected through their ownerReferences).
rules:
  # The 8 CRDs are enumerated explicitly instead of "*"/"*". status subresources
  # need separate rules; no delete on the CRs themselves (the operator never deletes user CRs).
  - apiGroups: ["mssql-operator.evariops.com"]
    resources:
      - sqlinstances
      - sqlavailabilitygroups
      - sqlavailabilitygroupdatabases
      - sqlconfigurations
      - sqlusers
      - sqlstoredprocedures
      - sqltdecertificates
      - sqlagentjobs
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["mssql-operator.evariops.com"]
    resources:
      - sqlinstances/status
      - sqlavailabilitygroups/status
      - sqlavailabilitygroupdatabases/status
      - sqlconfigurations/status
      - sqlusers/status
      - sqlstoredprocedures/status
      - sqltdecertificates/status
      - sqlagentjobs/status
    verbs: ["get", "update", "patch"]
  # The control registry is the operator's own — it creates, patches (compare-and-swap) and,
  # once its resource and volumes are gone, deletes it. Humans only read it.
  - apiGroups: ["mssql-operator.evariops.com"]
    resources: ["sqlcontrolrecords"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Secrets: read the referenced ones (sa, master key, TDE sources, credentials), write the ones the
  # operator generates (machine key, SMK backup, TDE archives, deployer login). list serves the TDE
  # discovery by labels; watch, on the owner-labelled ones only, so that the deletion of a
  # key Secret is seen at once — reduced to metadata in the operator. No patch, no delete.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update"]
  # Owned children, applied server-side and watched to repair drift.
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # PVCs are created by the StatefulSet controller; the operator grows them and stamps their owner.
  # List and watch the owner-labelled ones, routed to their owner.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  # A repeated event updates the series of the existing Event (PUT): without update, only
  # the first occurrence was ever visible. Delete, because an event whose message
  # changed is replaced (the note of an events.k8s.io Event is immutable).
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    # delete: with propagationPolicy=Orphan only, to recreate a StatefulSet around its pods (volume
    # growth, selector migration).
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # patch: the AG controller maintains the dynamic pod labels (ag-role, listener-ready,
    # sync-state, fenced, ...) that drive the R/W and RO listener selectors — i.e. failover
    # repointing. delete: rolling updates and the fencing of an unreachable primary. watch:
    # a recreated, deleted or unready SQL pod reconciles its owner at once.
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  # Fencing of an unreachable AG primary before a promotion (ReplicaFencer): the node's readiness
  # decides between graceful deletion and storage detachment, which needs the PVs, the CSI driver
  # (does it use VolumeAttachments at all?) and the attachments themselves.
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers"]
    verbs: ["get"]
  {{- if ne .Values.breakout.fencingDriver "none" }}
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "delete"]
  {{- end }}
  {{- if and .Values.breakout.enabled (not .Values.breakout.dedicated) }}
  # In-process breakout (breakout.dedicated=false). It never taints a node; patch only removes
  # the NoExecute taints of earlier versions (removeBy 2.0.0). It reads node Leases
  # (relocationDelay).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mssql-operator.fullname" . }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mssql-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mssql-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election Leases live in the operator's namespace only — a cluster-wide grant let the
# operator take over the election of any other component (kube-system included).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mssql-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    # The epoch Lease (mssql-operator-epoch) is patched by compare-and-swap.
    # So is the rollout budget's (mssql-operator-rollout-slots).
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mssql-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mssql-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "mssql-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
