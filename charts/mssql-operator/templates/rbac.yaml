apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mssql-operator.fullname" . }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
rules:
  # The 8 CRDs are enumerated explicitly instead of "*"/"*". status subresources
  # need separate rules; no delete on the CRs themselves (the operator never deletes user CRs).
  - apiGroups: ["mssql-operator.evariops.com"]
    resources:
      - sqlinstances
      - sqlavailabilitygroups
      - sqlavailabilitygroupdatabases
      - sqlconfigurations
      - sqlusers
      - sqlstoredprocedures
      - sqltdecertificates
      - sqlagentjobs
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["mssql-operator.evariops.com"]
    resources:
      - sqlinstances/status
      - sqlavailabilitygroups/status
      - sqlavailabilitygroupdatabases/status
      - sqlconfigurations/status
      - sqlusers/status
      - sqlstoredprocedures/status
      - sqltdecertificates/status
      - sqlagentjobs/status
    verbs: ["get", "update", "patch"]
  # secrets: read saPasswordSecretRef/etc.; write the operator-generated machine-key/SMK/TDE
  # secrets. The operator watches cluster-wide today; set watchNamespaces in values to scope
  # this to per-namespace Roles (generates Role/RoleBinding per listed namespace).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  # Aggregated-API authorization delegation (SubjectAccessReview/TokenReview).
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- if .Values.breakout.enabled }}
  # Split-brain fencing (breakout) runs in-process and needs to inspect nodes and detach RWO
  # volumes from a dead node. pods(delete) and persistentvolumeclaims(get/list) are already granted above.
  - apiGroups: [""]
    resources: ["nodes"]
    # patch: the breakout driver taints a fenced node NoExecute.
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mssql-operator.fullname" . }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mssql-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mssql-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
