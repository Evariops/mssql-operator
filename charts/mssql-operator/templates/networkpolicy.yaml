{{- if .Values.networkPolicy.enabled }}
{{- $apiCidrs := include "mssql-operator.apiServerCidrs" . | fromJsonArray }}
# Restricts the operator pod's traffic. Uses the standard NetworkPolicy API so
# it works on any CNI that enforces policies (the SQL pods' optional policy is Cilium-only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mssql-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mssql-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  policyTypes: [Ingress, Egress]
  ingress:
    # Webhook + aggregated view API: from the API server / aggregator. The apiserver's source IP is
    # not selectable by labels: the port stays open cluster-wide unless webhookFrom is given, or
    # webhookFromApiServerOnly restricts it to the API server addresses (the endpoint does
    # not authenticate its caller).
    - ports:
        - port: {{ .Values.webhook.port }}
          protocol: TCP
      {{- if .Values.networkPolicy.webhookFrom }}
      from:
        {{- toYaml .Values.networkPolicy.webhookFrom | nindent 8 }}
      {{- else if and .Values.networkPolicy.webhookFromApiServerOnly $apiCidrs }}
      from:
        {{- range $apiCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    {{- if and .Values.viewApi.enabled (or .Values.networkPolicy.webhookFrom (and .Values.networkPolicy.webhookFromApiServerOnly $apiCidrs)) }}
    # A follower asks the leader for its plans (kubectl get operatorplans).
    - ports:
        - port: {{ .Values.webhook.port }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "mssql-operator.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: operator
    {{- end }}
    # Metrics/health: scrapers only (override selector via values).
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- include "mssql-operator.apiServerEgress" . | nindent 4 }}
    {{- if .Values.viewApi.enabled }}
    # A follower asks the leader for its plans (kubectl get operatorplans).
    - ports:
        - port: {{ .Values.webhook.port }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "mssql-operator.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: operator
    {{- end }}
    # SQL Server pods (TDS + AG mirroring endpoints), in any namespace — the ports used to be
    # open to every destination.
    - ports:
        - port: 1433
          protocol: TCP
        - port: 5022
          protocol: TCP
      to:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: mssql-operator.evariops.com/instance
                operator: Exists
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: mssql-operator.evariops.com/ag
                operator: Exists
    {{- if .Values.networkPolicy.allowExternalHttps }}
    # GitHub / S3 (stored-procedure sources, TDE backup) — only if those features are used.
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
