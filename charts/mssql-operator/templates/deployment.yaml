apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mssql-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mssql-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "mssql-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mssql-operator.serviceAccountName" . }}
      {{- with (include "mssql-operator.priorityClassName" .) }}
      priorityClassName: {{ . }}
      {{- end }}
      # The operator must itself pass PSS 'restricted' — the SQL pods it generates
      # are already hardened, the operator should not be the weak link.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: https
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- if .Values.webhook.enabled }}
            # ASPNETCORE_URLS would override Kestrel:Endpoints, so configure both listeners via
            # Kestrel config when the HTTPS webhook endpoint is needed alongside HTTP health/metrics.
            - name: Kestrel__Endpoints__Http__Url
              value: "http://+:{{ .Values.metrics.port }}"
            - name: Kestrel__Endpoints__Https__Url
              value: "https://+:{{ .Values.webhook.port }}"
            # The serving certificate is read from this directory and reloaded when the
            # mounted Secret changes (renewal), without a restart.
            - name: Webhook__CertificateDirectory
              value: /certs
            {{- if .Values.viewApi.enabled }}
            # The aggregated view API authenticates the kube-aggregator by its front-proxy client
            # certificate. AllowCertificate negotiates (but does not require) a client cert, so admission
            # webhook calls — which present none — still succeed, while view-API requests are validated
            # against requestheader-client-ca in FrontProxyAuthenticator.
            - name: Kestrel__Endpoints__Https__ClientCertificateMode
              value: AllowCertificate
            {{- end }}
            {{- else }}
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.metrics.port }}"
            {{- end }}
            - name: Logging__LogLevel__Default
              value: {{ .Values.logLevel | quote }}
            - name: Logging__Format
              value: {{ .Values.logFormat | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Only these pods of the operator namespace reach port 1433 of the SQL pods.
            - name: Operator__OperatorPodSelector
              value: {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s,app.kubernetes.io/component=operator" (include "mssql-operator.name" .) .Release.Name | quote }}
            {{- with .Values.operator }}
            - name: Operator__WorkerCount
              value: {{ .workerCount | quote }}
            - name: Operator__MaxConcurrentRestarts
              value: {{ .maxConcurrentRestarts | quote }}
            - name: Operator__EngineUpgradePolicy
              value: {{ .engineUpgradePolicy | quote }}
            - name: Operator__SafetyLevelMax
              value: {{ .safetyLevelMax | default 1 | quote }}
            - name: Operator__TargetCircuitBreakers
              value: {{ .targetCircuitBreakers | default "Shadow" | quote }}
            - name: Operator__PlannedFailoverLsnCheck
              value: {{ .plannedFailoverLsnCheck | default "Shadow" | quote }}
            {{- range $i, $registry := .allowedImageRegistries }}
            - name: Operator__AllowedImageRegistries__{{ $i }}
              value: {{ $registry | quote }}
            {{- end }}
            {{- with .nodeMaintenance }}
            - name: Operator__NodeMaintenance
              value: {{ .mode | default "Shadow" | quote }}
            {{- range $i, $taint := .disruptionTaints }}
            - name: Operator__NodeMaintenanceTaints__{{ $i }}
              value: {{ $taint | quote }}
            {{- end }}
            {{- end }}
            {{- with .automation }}
            - name: Operator__Automation__MaxMode
              value: {{ .maxMode | default "Apply" | quote }}
            - name: Operator__Automation__MaxDestructivePerHour
              value: {{ .maxDestructivePerHour | quote }}
            {{- end }}
            {{- end }}
            # The fencing of an unreachable AG primary uses the driver in every mode.
            - name: FailoverBreakout__FencingDriver
              value: {{ .Values.breakout.fencingDriver | quote }}
            {{- if and .Values.breakout.enabled .Values.breakout.dedicated }}
            # The breakout controller runs in its own Deployment.
            - name: Operator__Role
              value: Operator
            {{- else if .Values.breakout.enabled }}
            # Split-brain fencing runs in-process; the operator's ClusterRole carries the extra perms.
            - name: FailoverBreakout__Enabled
              value: "true"
            - name: FailoverBreakout__ControlLoopPeriodSeconds
              value: {{ .Values.breakout.controlLoopPeriodSeconds | quote }}
            - name: FailoverBreakout__TerminatingThresholdSeconds
              value: {{ .Values.breakout.terminatingThresholdSeconds | quote }}
            - name: FailoverBreakout__NodeReadyGracePeriodSeconds
              value: {{ .Values.breakout.nodeReadyGracePeriodSeconds | quote }}
            - name: FailoverBreakout__MaxConcurrentFencing
              value: {{ .Values.breakout.maxConcurrentFencing | quote }}
            - name: FailoverBreakout__RelocationDelaySeconds
              value: {{ .Values.breakout.relocationDelaySeconds | quote }}
            {{- range $i, $driver := .Values.breakout.trustedFencingCsiDrivers }}
            - name: FailoverBreakout__TrustedFencingCsiDrivers__{{ $i }}
              value: {{ $driver | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.sqlConnection }}
            # Operator -> SQL TLS. Defaults: encrypted but server cert not validated.
            - name: SqlConnection__Encrypt
              value: {{ .encrypt | quote }}
            - name: SqlConnection__TrustServerCertificate
              value: {{ .trustServerCertificate | quote }}
            {{- with .hostNameInCertificate }}
            - name: SqlConnection__HostNameInCertificate
              value: {{ . | quote }}
            {{- end }}
            {{- with .serverCertificate }}
            - name: SqlConnection__ServerCertificate
              value: {{ . | quote }}
            {{- end }}
            {{- if .caSecretName }}
            # The CA that issued the SQL pods' certificates joins the trust store (.NET reads
            # SSL_CERT_DIR on top of the system bundle).
            - name: SSL_CERT_DIR
              value: /etc/mssql-operator/sql-ca
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.webhook.enabled .Values.sqlConnection.caSecretName }}
          volumeMounts:
            {{- if .Values.webhook.enabled }}
            - name: webhook-certs
              mountPath: /certs
              readOnly: true
            {{- end }}
            {{- if .Values.sqlConnection.caSecretName }}
            - name: sql-ca
              mountPath: /etc/mssql-operator/sql-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.webhook.enabled .Values.sqlConnection.caSecretName }}
      volumes:
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "mssql-operator.fullname" . }}-webhook-tls
        {{- end }}
        {{- if .Values.sqlConnection.caSecretName }}
        - name: sql-ca
          secret:
            secretName: {{ .Values.sqlConnection.caSecretName }}
            items:
              - key: {{ .Values.sqlConnection.caSecretKey | default "ca.crt" }}
                path: ca.crt
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- include "mssql-operator.topologySpread" (list . "operator" .Values.topologySpreadConstraints) | nindent 8 }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        # Replicas on distinct nodes when possible — two on one node are no HA.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "mssql-operator.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: operator
            # Away from the SQL Server pods — losing their node must not take the operator leader with it.
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaceSelector: {}
                labelSelector:
                  matchExpressions:
                    - key: mssql-operator.evariops.com/instance
                      operator: Exists
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaceSelector: {}
                labelSelector:
                  matchExpressions:
                    - key: mssql-operator.evariops.com/ag
                      operator: Exists
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
